<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Бланки · Тренировочный итоговый тест · Математика 5</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="blanks.css?v=1">
</head>
<body>
  <div class="bar noprint">
    <b>🖨 Бланки для учеников</b>
    <label>Вариант: <select id="sel"><option value="all">все 5 вариантов</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Копий каждого: <input type="number" id="copies" min="1" max="40" value="1"></label>
    <button id="print">Печать / сохранить PDF</button>
    <span class="tip">В окне печати выберите принтер или «Сохранить как PDF». Формат A4, поля — по умолчанию.</span>
  </div>
  <div id="pages"></div>
  <script type="module" src="blanks.js?v=1"></script>

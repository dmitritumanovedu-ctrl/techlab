<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="engine/guard.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Суммативное оценивание · География, 11 класс</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{
  --blue:#1f5f9e; --blue-d:#174a7c; --blue-l:#e8f0f8; --sky:#f3f7fb;
  --ink:#1d2733; --muted:#5d6b7a; --line:#c9d3de; --paper:#fff;
  --green:#2f7d3b; --warm:#d98b2b; --warm-l:#fdf3e4;
  --good:#2f7d3b; --good-l:#e9f4ea; --bad:#b3412f; --bad-l:#fbecea; --mid:#a86b12; --mid-l:#fdf3e1;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", "PT Sans", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--sky);line-height:1.45}
body::before{content:"";display:block;height:6px;background:var(--blue)}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}

/* --- кнопки --- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:.5rem .95rem;border-radius:8px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--blue);background:var(--blue-l)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.big{padding:.8rem 1.4rem;font-size:1.05rem}
.btn.small{padding:.3rem .7rem;font-size:.9rem}

/* --- старт --- */
.start{min-height:calc(100vh - 6px);display:grid;place-items:center;padding:2rem 1rem;
  background:linear-gradient(var(--blue) 0 210px, var(--sky) 210px)}
.start-card{background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(23,74,124,.14);max-width:560px;width:100%;padding:2rem 2rem 1.6rem}
.start-card.wide{max-width:820px}
.kicker{margin:0;color:var(--warm);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}
.start h1{margin:.3rem 0 .2rem;font-family:var(--serif);font-size:2.1rem;color:var(--blue-d)}
.sub{margin:0 0 1.2rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:0 0 1.4rem}
.facts div{background:var(--blue-l);border-radius:10px;padding:.6rem .4rem;text-align:center}
.facts b{display:block;font-size:1.5rem;color:var(--blue-d);font-family:var(--serif)}
.facts span{font-size:.82rem;color:var(--muted)}
form label{display:block;font-size:.9rem;font-weight:600;margin-bottom:.9rem;color:var(--muted)}
form input,form select{display:block;width:100%;margin-top:.3rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
form input[readonly]{background:#f3f6f9;color:var(--muted)}
form input:focus,form select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
form .btn{width:100%;margin-top:.3rem}
.notice{background:var(--warm-l);border:1px solid #f0d3a6;border-radius:10px;padding:.7rem .9rem;margin:0 0 1rem;font-size:.95rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rules{margin-top:1.2rem;border-top:1px solid #e6ecf2;padding-top:.9rem;font-size:.92rem;color:var(--muted)}
.rules summary{cursor:pointer;font-weight:600;color:var(--blue)}
.rules ul{padding-left:1.1rem}
table.scale{border-collapse:collapse;margin:.6rem 0;font-size:.9rem;min-width:220px}
table.scale th,table.scale td{border:1px solid var(--line);padding:.25rem .8rem;text-align:center}
table.scale th{background:var(--blue-l)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem;margin:1rem 0}
.tv{border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tv b{width:100%;font-family:var(--serif)}

/* --- верхняя панель --- */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;padding:.55rem 1.2rem;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.bar-l{display:flex;flex-direction:column;line-height:1.2}
.bar-l span{font-size:.85rem;color:var(--muted)}
.bar-c{text-align:center;font-size:.9rem;color:var(--muted);min-width:220px}
.bar-r{display:flex;gap:.6rem;justify-content:flex-end;align-items:center}
.pbar{height:5px;background:#e3e9f0;border-radius:3px;overflow:hidden;margin-top:.3rem}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;color:var(--blue-d);background:var(--blue-l);padding:.25rem .7rem;border-radius:8px}
.timer.warn{color:var(--bad);background:var(--bad-l)}

/* --- лист бланка --- */
.sheet{max-width:1000px;margin:1.4rem auto 3rem;background:var(--paper);box-shadow:0 2px 16px rgba(23,74,124,.1);border-radius:6px;padding:2.2rem 2.4rem;font-family:var(--serif)}
.blank-head{text-align:center;margin-bottom:1.2rem}
.blank-head p{margin:.1rem 0}
.h-title{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1.15rem}
.h-sub{font-weight:700}
.h-year{color:var(--muted);font-style:italic}
.h-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:.35rem 2rem;text-align:left;margin:1rem 0 .6rem;font-size:.98rem}
.fill{display:inline-block;min-width:140px;border-bottom:1px solid var(--ink);padding:0 .3rem;font-weight:700}
.h-var{font-weight:700;font-size:1.15rem;margin-top:.6rem!important}

table.blank{width:100%;border-collapse:collapse;font-size:1rem;table-layout:fixed}
table.blank th:first-child{width:2.6rem}table.blank th:last-child{width:6.4rem}
table.barem th:nth-child(2){width:4rem}table.barem th:last-child{width:30%}
table.blank th{background:var(--blue-l);border:1px solid #9fb2c6;padding:.4rem;font-family:var(--sans);font-size:.85rem;letter-spacing:.05em}
table.blank td{border:1px solid #9fb2c6;padding:.55rem .7rem;vertical-align:top}
table.blank tr.part td{border-top:none;border-bottom:none}
table.blank tr.part td.body{padding-top:.15rem}
table.blank tr.t-head td.stem{border-bottom:none}
table.blank tr.part+tr.t-head td,table.blank tr.part+tr.sec td,table.blank tr.part+tr.total td{border-top:1px solid #9fb2c6}
table.blank tr.part:last-of-type td{border-bottom:1px solid #9fb2c6}
td.num{width:2.6rem;text-align:center;font-weight:700}
td.pts{width:6.4rem;text-align:center;font-family:var(--sans);font-size:.85rem;color:var(--muted)}
td.pts b{color:var(--ink);font-size:1rem}
tr.sec td{background:#f4f8f3;color:var(--green);font-weight:700;font-family:var(--sans);font-size:.95rem;padding:.45rem .7rem}
tr.total td{font-weight:700;text-align:right}
td.stem{font-weight:600}
.q{margin:.35rem 0 .15rem}

/* поля как на бумаге */
.line{border:none;border-bottom:1px dashed #8aa0b6;background:transparent;font:inherit;font-family:var(--sans);color:var(--blue-d);padding:.25rem .2rem;outline:none;min-width:0}
.line:focus{border-bottom:2px solid var(--blue);background:var(--blue-l)}
.line.full{width:100%}
.two{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.2rem .5rem;align-items:end}
.dot{color:var(--muted)}
textarea.ruled{width:100%;border:1px solid #dbe3ec;border-radius:4px;resize:vertical;font:inherit;font-family:var(--sans);color:var(--blue-d);padding:0 .5rem;line-height:1.9rem;
  background:repeating-linear-gradient(#fff 0 calc(1.9rem - 1px), #cfd9e4 calc(1.9rem - 1px) 1.9rem);background-attachment:local;min-height:5.9rem}
textarea.ruled:focus{outline:none;border-color:var(--blue)}
.tf{display:grid;grid-template-columns:9.5rem auto 1fr;gap:.6rem;align-items:start;padding:.3rem 0}
.tf-fix .line{width:100%;margin-top:.2rem}
.vn{display:flex;gap:.3rem}
.pill{display:inline-grid;place-items:center;width:2rem;height:2rem;border:1.5px solid #8aa0b6;border-radius:50%;font-weight:700;font-family:var(--sans);cursor:pointer;user-select:none}
.pill input{display:none}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tf-s u{text-decoration-thickness:2px;text-underline-offset:3px}
table.grp{border-collapse:collapse;margin:.3rem 0;min-width:70%}
table.grp th,table.grp td{border:1px solid #c3cfdb;padding:.35rem .6rem;font-size:.95rem}
table.grp th{background:#f6f9fc;font-family:var(--sans);font-size:.85rem}
table.grp td.c{text-align:center;width:9rem}
.pick input{display:none}
.pick span{display:inline-block;width:1.25rem;height:1.25rem;border:1.5px solid #8aa0b6;border-radius:4px;vertical-align:middle;cursor:pointer}
.pick input:checked+span{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff}
figure.map{margin:.7rem 0 .2rem;text-align:center}
figure.map img{max-width:100%;border:1px solid #c3cfdb;border-radius:4px}
figure.map figcaption{font-size:.85rem;color:var(--muted);font-weight:400}

/* баллы L 0 1 2 */
.boxes{display:inline-flex;flex-wrap:wrap;gap:2px;margin-top:.35rem;justify-content:center;align-items:center;max-width:5.4rem}
.boxes .L{font-size:.7rem;color:#9aa8b6;margin-right:2px}
.boxes.wide .L{width:100%;margin:0}
.sb{display:inline-block;width:1.45rem;height:1.3rem;line-height:1.3rem;border:1px solid #b7c4d1;font-size:.78rem;color:#7d8b99;background:#fff}
.sb.on{background:var(--warm);border-color:var(--warm);color:#fff;font-weight:700}

/* проверка */
.rv{margin:.5rem 0 .3rem;padding:.55rem .75rem;border-radius:6px;font-family:var(--sans);font-size:.92rem;border-left:4px solid}
.rv.good{background:var(--good-l);border-color:var(--good);color:#205a29}
.rv.mid{background:var(--mid-l);border-color:var(--mid);color:#7a4c0a}
.rv.bad{background:var(--bad-l);border-color:var(--bad);color:#82301f}
.rv.self{background:#f5f8fb;border-color:var(--blue);color:var(--ink)}
.model{margin-top:.25rem;color:var(--ink)}
.model span{font-weight:700;color:var(--muted)}
.model i{color:var(--muted)}
.rate{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.rate button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.3rem .6rem;font-size:.86rem}
.rate button:hover{border-color:var(--blue)}
.rate button.on{background:var(--warm);border-color:var(--warm);color:#fff}
.mode-review input:disabled,.mode-review textarea:disabled{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.mode-review .pill,.mode-review .pick span{cursor:default}

.result{font-family:var(--sans);border:1px solid var(--line);border-radius:10px;padding:1.2rem;margin-bottom:1.8rem;background:linear-gradient(#f7fafd,#fff)}
.res-top{display:flex;gap:1.2rem;align-items:center}
.res-mark{flex:none;width:6.2rem;height:6.2rem;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.res-mark span{font-size:.75rem;opacity:.85;align-self:end}
.res-mark b{font-size:2.8rem;font-family:var(--serif);align-self:start}
.res-mark.wait{background:#9fb2c6}
.res-main h2{margin:0 0 .3rem;font-family:var(--serif);color:var(--blue-d)}
.res-main p{margin:.2rem 0;color:var(--muted)}
.meta{font-size:.88rem}
.warnc{color:var(--bad)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1rem 0 .8rem}
.rsec{background:#fff;border:1px solid #e1e8ef;border-radius:8px;padding:.6rem .7rem;font-size:.85rem;color:var(--muted)}
.rsec b{display:block;color:var(--ink);font-size:1.15rem;margin-top:.15rem}
.res-tasks{display:flex;flex-wrap:wrap;gap:.4rem}
.res-tasks a{text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:.25rem .55rem;font-size:.85rem;color:var(--ink);background:#fff}
.res-tasks a b{margin-left:.35rem}
.res-tasks a.full{border-color:#9cc8a3;background:var(--good-l)}
.res-tasks a.zero{border-color:#e3b0a7;background:var(--bad-l)}

.sign{margin-top:1.6rem;font-size:.95rem}
.end{text-align:center;margin-top:2rem}
table.barem td{font-size:.93rem}
table.barem td.crit{width:30%;color:var(--muted);font-family:var(--sans);font-size:.85rem}
.sc-h{font-family:var(--serif);margin-top:1.6rem}

.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,150%);opacity:0;visibility:hidden;background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-size:.92rem;transition:transform .3s;z-index:50;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:rgba(20,35,50,.45);display:grid;place-items:center;z-index:60;padding:1rem}
.mbox{background:#fff;border-radius:12px;padding:1.4rem 1.5rem;max-width:430px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 .5rem;font-family:var(--serif);color:var(--blue-d)}
.mbtns{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}

.mode-test .sheet{user-select:none}
.mode-test .sheet input,.mode-test .sheet textarea{user-select:text}

@media (max-width:760px){
  .boxes{max-width:2.6rem}
  .sheet{padding:1.2rem .8rem;margin:.6rem}
  .bar{grid-template-columns:1fr auto;padding:.5rem .7rem}
  .bar-c{display:none}
  .bar-r .btn{padding:.4rem .6rem;font-size:.85rem}
  .tf{grid-template-columns:1fr;gap:.3rem}
  .tf .vn{order:-1}
  .tf-fix{order:3}
  .h-grid{grid-template-columns:1fr}
  td.pts{width:3.2rem}
  table.blank th:first-child{width:2rem}table.blank th:last-child{width:3.4rem}
  table.blank td{padding:.45rem .45rem}
  table.blank th{font-size:.7rem;letter-spacing:0}
  .fill{min-width:90px}
  .facts b{font-size:1.2rem}
  .res-grid{grid-template-columns:1fr}
  .two{grid-template-columns:auto 1fr}
  table.grp{min-width:100%}
}
@media print{
  body{background:#fff}
  body::before,.bar,.end,.toast,.rate,.modal{display:none!important}
  .sheet{box-shadow:none;margin:0;max-width:none;padding:0}
  .result{break-inside:avoid}
  tr{break-inside:avoid}
  .line{border-bottom:1px solid #555}
  textarea.ruled{border:none;resize:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sb.on,.pill.on,.pick input:checked+span,.rv,.res-mark,tr.sec td,table.blank th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.pv{background:#fff4dc;color:#5a4300;text-align:center;font-size:.9rem;padding:.45rem;font-weight:600}
.rules-list{font-size:.88rem;color:var(--muted);padding-left:1.1rem;margin:.2rem 0 1rem}
.rules-list li{margin:.25rem 0}
.err{color:var(--bad);font-size:.92rem;min-height:1.2rem;margin:.2rem 0 .5rem;font-weight:600}
.saved{font-size:.8rem;color:var(--good)}
.tnote{margin-top:.35rem;font-size:.85rem;color:var(--blue-d)}
/* панель учителя */
.t-top{background:var(--blue);color:#fff;padding:.9rem 1.4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.t-top h1{margin:0;font-size:1.15rem;font-weight:700}
.t-top #who{font-size:.88rem;opacity:.9}.t-top #who a{color:#fff}
.t-main{max-width:1250px;margin:0 auto;padding:1.2rem}
.tcard{background:#fff;border:1px solid #dfe7ef;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.tcard.narrow{max-width:520px;margin:3rem auto;text-align:center}
.tcard h2{margin:.2rem 0 .4rem;font-family:var(--serif);color:var(--blue-d)}
.muted{color:var(--muted)}.small{font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.8rem 0 .3rem}
.switch{display:flex;align-items:center;gap:.6rem;font-weight:600;cursor:pointer;background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem}
.switch input{width:1.2rem;height:1.2rem}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.toolbar select,.toolbar input{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.stat{background:#fff;border:1px solid #dfe7ef;border-radius:10px;padding:.5rem .9rem;font-size:.82rem;color:var(--muted);min-width:110px}
.stat b{display:block;font-size:1.25rem;color:var(--ink)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #dfe7ef;border-radius:12px;margin-bottom:1rem}
table.res{width:100%;border-collapse:collapse;font-size:.9rem}
table.res th{background:var(--blue-l);text-align:left;padding:.55rem .6rem;font-size:.8rem;white-space:nowrap}
table.res td{border-top:1px solid #edf1f5;padding:.5rem .6rem;vertical-align:middle}
.nowrap{white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:.12rem .45rem;font-size:.8rem;font-weight:600}
.tag.run{background:var(--blue-l);color:var(--blue-d)}.tag.done{background:var(--good-l);color:var(--good)}.tag.warn{background:var(--mid-l);color:var(--mid)}
.grade{display:inline-grid;place-items:center;min-width:2rem;height:2rem;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:1.05rem}
.grade.pending{background:#9fb2c6;padding:0 .3rem}
.btn.red{color:var(--bad)}.btn.red:hover{background:var(--bad-l);border-color:var(--bad)}
.backlink{display:inline-block;margin:0 0 .8rem;text-decoration:none;font-weight:600}
.chk{position:fixed;inset:0;z-index:40;background:var(--sky);overflow:auto}
.chk-bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:.6rem 1.2rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.92rem}
.chk-bar .sp{flex:1}
body.noscroll{overflow:hidden}
.rv.tch .rate button{min-width:2.1rem}
.rv .src{font-size:.8rem;color:var(--muted);margin-left:.3rem}
.pbar-top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto}
@media print{.t-top,.backlink,.chk-bar,.pbar-top,.pv{display:none!important}.chk{position:static;overflow:visible}.t-main{padding:0}}

.stopmsg{color:var(--bad);font-weight:700;margin:.3rem 0}
.tag.bad{background:var(--bad-l);color:var(--bad)}

/* ---------- новые типы заданий ---------- */
.mc{display:grid;gap:.3rem;margin:.2rem 0 .3rem}
.mc .ch{display:flex;gap:.5rem;align-items:flex-start;padding:.4rem .6rem;border:1px solid #dbe3ec;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:.95rem;background:#fff}
.mc .ch:hover{border-color:var(--blue)}
.mc .ch.on{background:var(--blue-l);border-color:var(--blue);font-weight:600}
.mc .ch input{margin-top:.2rem;accent-color:var(--blue)}
.mc .lt{color:var(--muted);font-weight:700}
.selrow,.numrow{display:grid;grid-template-columns:minmax(150px,1fr) 1.4fr;gap:.6rem;align-items:center;padding:.3rem 0}
.selrow.long{grid-template-columns:minmax(140px,.7fr) 2fr}
.selrow select,.ord select,.sc-sel{font:inherit;font-family:var(--sans);font-size:.92rem;padding:.4rem .5rem;border:1px solid #9fb2c6;border-radius:6px;background:#fff;color:var(--blue-d);max-width:100%;width:100%}
.selrow select:focus,.ord select:focus,.sc-sel:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.numrow .num{width:9rem;justify-self:start;font-size:1rem}
.ord{display:grid;gap:.35rem;margin:.3rem 0}
.ordrow{display:grid;grid-template-columns:5rem 1fr;gap:.6rem;align-items:center;padding:.35rem .5rem;border:1px dashed #c3cfdb;border-radius:8px;font-family:var(--sans);font-size:.95rem}
.scheme{font-family:var(--sans);margin:.4rem 0;padding:.6rem;background:#f8fafc;border:1px solid #e1e8ef;border-radius:10px}
.sc-root{background:var(--blue);color:#fff;font-weight:700;text-align:center;padding:.5rem .7rem;border-radius:8px;margin:0 auto .7rem;max-width:520px}
.sc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem}
.sc-col{display:flex;flex-direction:column;gap:.4rem;border-top:3px solid var(--blue-l);padding-top:.5rem}
.sc-node{background:var(--blue-l);color:var(--blue-d);font-weight:700;text-align:center;padding:.4rem;border-radius:6px;font-size:.92rem}
.sc-node.sm{background:#fff;border:1px dashed #9fb2c6;font-weight:600;font-size:.85rem}
.sc-sel{white-space:normal}
.mapbox{position:relative;display:inline-block;max-width:100%;line-height:0}
.mapbox img{max-width:100%;border:1px solid #c3cfdb;border-radius:4px}
.mk{position:absolute;transform:translate(-50%,-50%);width:1.45rem;height:1.45rem;border-radius:50%;background:#C62828;color:#fff;font:700 .85rem/1.45rem var(--sans);text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.4)}
.fig{margin:.7rem 0 .3rem}
.fig figcaption{font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:.35rem;font-family:var(--sans)}
table.stat{border-collapse:collapse;font-family:var(--sans);font-size:.92rem;font-weight:400;min-width:60%}
table.stat th,table.stat td{border:1px solid #c3cfdb;padding:.3rem .6rem}
table.stat th{background:#f0f5fb;font-size:.82rem}
table.stat td.nmr{text-align:center}
table.stat tr:last-child td{font-weight:700}
svg.chart{width:100%;max-width:640px;height:auto;font-family:var(--sans)}
svg.chart .bv{font-size:13px;font-weight:700;fill:#1d2733}
svg.chart .bl{font-size:12px;fill:#5d6b7a}
.legend{font-size:.82rem;color:var(--muted);font-family:var(--sans);font-weight:400;margin:.2rem 0}
.ex{margin-top:.35rem;font-size:.88rem;color:#3d4b5a;background:#fffbea;border-radius:6px;padding:.35rem .55rem}
.bq{font-size:.82rem;color:var(--muted)}
.mode-review select:disabled,.mode-review .mc input:disabled+span{color:var(--ink);opacity:1}
.mode-review select:disabled{background:#f6f8fa;-webkit-text-fill-color:var(--ink)}
@media (max-width:760px){.selrow,.selrow.long,.numrow{grid-template-columns:1fr}.mk{width:1.3rem;height:1.3rem;font-size:.75rem;line-height:1.3rem}.ordrow{grid-template-columns:4rem 1fr}}
@media print{.mc .ch{border:none;padding:.1rem}.scheme{background:#fff}}

blockquote.src{margin:.6rem 0 .3rem;padding:.7rem .9rem;background:#f6f8fb;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;font-weight:400;font-style:italic;line-height:1.5}
</style>
</head>

/* ===== ОБЩЕЕ (ученик и учитель): задания, бланк, проверка, схема оценивания ===== */
const WORK = { id: 'geo11-kr1', minutes: 45, max: 50,
  title: 'Суммативное оценивание по единице обучения «Политическая карта мира. Природные условия и ресурсы»' };
const DURATION = WORK.minutes * 60 * 1000;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => String(h ?? '').replace(/<[^>]+>/g, '');
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[-–—]/g, ' ').replace(/[«»"'.,;:!?()\[\]\/\\%]/g, ' ').replace(/\s+/g, ' ').trim();
const hasAll = (a, x) => norm(x).split(' ').every(w => a.includes(w));
const hit = (ans, stems) => { const a = ' ' + norm(ans) + ' '; return !!norm(ans) && stems.some(x => hasAll(a, x)); };
const toNum = s => { const t = String(s ?? '').replace(/\s/g, '').replace(',', '.').match(/-?\d+(\.\d+)?/); return t ? parseFloat(t[0]) : NaN; };
const markFor = pts => SCALE.find(([min]) => pts >= min)[1];
const key = (n, i) => `t${n}p${i}`;
const fmtDate = ms => new Date(ms || Date.now()).toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
const f1 = x => String(x).replace('.', ',');
// детерминированное «перемешивание» (одинаковое у всех, кто пишет этот вариант)
const seeded = (arr, seed) => arr.map((x, i) => [x, (Math.sin(seed * 9301 + i * 49297) * 233280) % 1]).sort((a, b) => a[1] - b[1]).map(x => x[0]);

/* ---------- из данных варианта — список заданий ---------- */
const TASKS_CACHE = {};
function tasksOf(v) {
  if (TASKS_CACHE[v]) return TASKS_CACHE[v];
  const V = VARIANTS[v], s = v * 7 + 3;
  const defs = seeded([...V.t3.terms.map(([, k]) => DEF[k]), DEF[V.t3.extra]], s + 1);
  const mapOpts = [...V.t4.countries, ...V.t4.extra].sort((a, b) => a.localeCompare(b, 'ru'));
  const schOpts = seeded([...V.t8.ans, ...(V.sch8x || [])], s + 2);
  const effOpts = seeded([...V.t10.pairs.map(p => p[1]), V.t10.x], s + 4);
  const T = [
    { n: 1, sec: 1, stem: TF_STEM, parts: V.t1 },
    { n: 2, stem: MC_STEM, parts: V.t2 },
    { n: 3, stem: T3_STEM, parts: V.t3.terms.map(([term, k]) => ({ t: 'sel', q: `<b>${term}</b>`, a: DEF[k], opts: defs, long: true, ex: `${term} — ${DEF[k].charAt(0).toLowerCase() + DEF[k].slice(1)}.` })) },
    { n: 4, sec: 2, stem: MAP_STEM, map: V.t4.countries, parts: [
      ...V.t4.countries.map((c, i) => ({ t: 'sel', q: `Государство № ${i + 1}`, a: c, opts: mapOpts, ex: `№ ${i + 1} — ${c}.` })),
      mc(V.t4.q, ['№ 1', '№ 2', '№ 3', '№ 4'], V.t4.a - 1, V.t4.ex)] },
    { n: 5, stem: V.t5.stem, parts: [V.t5.g] },
    { n: 6, stem: V.t6.stem, fig: V.t6.fig, parts: V.t6.parts },
    { n: 7, sec: 3, stem: ORD_STEM, parts: [{ ...V.t7, q: V.t7.q.replace(ORD_STEM + ' ', ''), show: seeded(V.t7.items.map((_, j) => j), s + 3) }] },
    { n: 8, stem: SCH_STEM, parts: [{ ...V.t8, opts: schOpts }] },
    { n: 9, stem: OP_STEM, parts: V.t9 },
    { n: 10, stem: T10_STEM, parts: V.t10.pairs.map(([c, e, ex]) => ({ t: 'sel', q: c, a: e, opts: effOpts, long: true, ex })) },
    { n: 11, stem: T11_STEM, src: V.t11.text, parts: V.t11.parts },
  ];
  T.forEach(t => { t.p = t.parts.reduce((a, p) => a + maxOf(p), 0); });
  return (TASKS_CACHE[v] = T);
}
function maxOf(p) {
  if (p.t === 'tf' || p.t === 'op') return 2;
  if (p.t === 'grp') return p.items.length;
  if (p.t === 'ord') return p.items.length;
  if (p.t === 'sch') return p.ans.length;
  return 1;
}

/* ---------- проверка ---------- */
function answerText(p, k, A) {
  if (p.t === 'tf') return A[k + 'v'] ? A[k + 'v'] + (A[k + 'v'] === 'Н' && A[k + 'f'] ? ' → ' + A[k + 'f'] : '') : '';
  if (p.t === 'mc') return A[k] !== undefined && A[k] !== '' ? p.opts[+A[k]] : '';
  if (p.t === 'grp') return p.items.map(([n], j) => A[k + 'g' + j] !== undefined ? `${n} — ${p.cats[+A[k + 'g' + j]]}` : '').filter(Boolean).join('; ');
  if (p.t === 'ord') return p.items.map((x, j) => A[k + '_' + j] ? `${A[k + '_' + j]}. ${x}` : '').filter(Boolean).sort().join('; ');
  if (p.t === 'sch') return p.ans.map((_, b) => A[k + '_' + b] || '').filter(Boolean).join('; ');
  return A[k] || '';
}
function modelText(p) {
  if (p.t === 'tf') return p.a === 'В' ? 'Верно' : `Неверно; правильно: ${p.show}`;
  if (p.t === 'mc') return p.opts[p.a];
  if (p.t === 'grp') return p.cats.map((c, ci) => `${c}: ${p.items.filter(x => x[1] === ci).map(x => x[0]).join(', ')}`).join(' · ');
  if (p.t === 'ord') return p.items.map((x, j) => `${j + 1}. ${x}`).join('; ');
  if (p.t === 'sch') return p.ans.join('; ');
  if (p.t === 'num') return f1(p.v) + (p.unit ? ' ' + p.unit : '');
  if (p.t === 'op') return p.m;
  return p.a;
}
function autoOf(p, k, A) {
  if (p.t === 'tf') { const v = A[k + 'v']; if (!v || v !== p.a) return 0; return p.a === 'В' ? 2 : (hit(A[k + 'f'], p.fix) ? 2 : 1); }
  if (p.t === 'mc') return A[k] !== undefined && A[k] !== '' && +A[k] === p.a ? 1 : 0;
  if (p.t === 'sel') return A[k] === p.a ? 1 : 0;
  if (p.t === 'num') { const x = toNum(A[k]); return Number.isFinite(x) && Math.abs(x - p.v) <= p.tol + 1e-9 ? 1 : 0; }
  if (p.t === 'grp') return p.items.reduce((s, [, c], j) => s + (A[k + 'g' + j] !== undefined && +A[k + 'g' + j] === c ? 1 : 0), 0);
  if (p.t === 'ord') return p.items.reduce((s, _, j) => s + (+A[k + '_' + j] === j + 1 ? 1 : 0), 0);
  if (p.t === 'sch') {           // пропуски одной «ветки» можно заполнить в любом порядке
    let sc = 0; const gs = [...new Set(p.groups)];
    gs.forEach(g => {
      const idx = p.ans.map((_, b) => b).filter(b => p.groups[b] === g);
      const need = new Set(idx.map(b => p.ans[b])), got = new Set();
      idx.forEach(b => { const x = A[k + '_' + b]; if (x && need.has(x) && !got.has(x)) { got.add(x); sc++; } });
    });
    return sc;
  }
  return null;   // op — проверяет учитель
}
function evaluate(v, A = {}, MAN = {}) {
  const items = []; let sec = 1; const secs = { 1: [0, 0], 2: [0, 0], 3: [0, 0] }; const tasks = [];
  tasksOf(v).forEach(t => {
    if (t.sec) sec = t.sec; let ts = 0, tp = 0;
    t.parts.forEach((p, i) => {
      const k = key(t.n, i), max = maxOf(p), empty = !norm(answerText(p, k, A));
      let auto = autoOf(p, k, A);
      if (p.t === 'op' && empty) auto = 0;
      const man = Number.isFinite(MAN[k]) ? MAN[k] : null;
      const score = man ?? auto;
      items.push({ k, n: t.n, i, sec, p, max, auto, man, score, empty });
      if (score === null) tp++; else { ts += score; secs[sec][0] += score; }
      secs[sec][1] += max;
    });
    tasks.push({ n: t.n, sum: ts, max: t.p, pending: tp });
  });
  const total = items.reduce((s, x) => s + (x.score ?? 0), 0), pending = items.filter(x => x.score === null).length;
  return { items, total, pending, complete: !pending, grade: markFor(total), secs, tasks };
}
const cut = (x, n = 400) => { const s = String(x ?? '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function resultOf(v, A, MAN) {
  const e = evaluate(v, A, MAN);
  return { total: e.total, max: WORK.max, grade: e.grade, complete: e.complete, pct: Math.round(e.total / WORK.max * 100),
    items: e.items.map(x => ({ l: cut(`${x.n}. ${strip(x.p.q || x.p.s || (x.p.t === 'grp' ? 'Таблица' : x.p.t === 'sch' ? 'Схема' : 'Упорядочение'))}`, 300),
      s: x.score, m: x.max, a: cut(answerText(x.p, x.k, A) || '—'), k: cut(strip(modelText(x.p))), c: '' })) };
}

function figHTML(f) {
  if (!f) return '';
  if (f.type === 'table') return `<figure class="fig"><figcaption>${f.title}</figcaption><table class="stat"><thead><tr>${f.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${f.rows.map(r => `<tr>${r.map((c, j) => `<td${j ? ' class="nmr"' : ''}>${typeof c === 'number' ? f1(c) : c}</td>`).join('')}</tr>`).join('')}</tbody></table></figure>`;
  const mx = Math.max(...f.values), W = 640, H = 260, pad = 36, bw = (W - pad * 2) / f.values.length;
  const bars = f.values.map((v, i) => { const h = (v / mx) * (H - 70), x = pad + i * bw + bw * 0.18, y = H - 40 - h;
    return `<rect x="${x}" y="${y}" width="${bw * 0.64}" height="${h}" rx="3" fill="#3F7CC0"/>
      <text x="${x + bw * 0.32}" y="${y - 6}" text-anchor="middle" class="bv">${f1(v)}${f.unit || ''}</text>
      <text x="${x + bw * 0.32}" y="${H - 22}" text-anchor="middle" class="bl">${f.labels[i].length > 16 ? f.labels[i].slice(0, 15) + '…' : f.labels[i]}</text>`; }).join('');
  return `<figure class="fig"><figcaption>${f.title}</figcaption><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(f.title)}">
    <line x1="${pad}" y1="${H - 40}" x2="${W - pad}" y2="${H - 40}" stroke="#9fb2c6"/>${bars}</svg>
    ${f.labels.some(l => l.length > 16) ? `<p class="legend">${f.labels.map((l, i) => `${i + 1}) ${l} — ${f1(f.values[i])}${f.unit || ''}`).join(' · ')}</p>` : ''}</figure>`;
}

      <div>Класс: ${f(info.cls)}</div><div>Набрано баллов: <span class="fill" id="hScore">${info.score ?? '&nbsp;'}</span></div>
      <div>Дата: ${f(info.date)}</div><div>Отметка: <span class="fill" id="hMark">${info.mark ?? '&nbsp;'}</span></div>
    </div>
    <p class="h-var">Вариант № ${info.v !== undefined ? info.v + 1 : '__'}</p></header>`;
}
function scaleBoxes(n, i, max) {
  let b = '<span class="L">L</span>';
  for (let k = 0; k <= max; k++) b += `<span class="sb" data-k="${n}-${i}" data-v="${k}">${k}</span>`;
  return `<div class="boxes ${max > 2 ? 'wide' : ''}">${b}</div>`;
}
const opt = (val, label, cur) => `<option value="${esc(val)}" ${cur === String(val) ? 'selected' : ''}>${esc(label)}</option>`;
function partHTML(t, p, i, mode, A) {
  const k = key(t.n, i), ro = mode !== 'test' ? 'disabled' : '';
  if (p.t === 'tf') {
    const v = A[k + 'v'] || '';
    return `<div class="tf">
      <span class="tf-fix"><input class="line" data-a="${k}f" value="${esc(A[k + 'f'])}" ${ro} placeholder="исправление" aria-label="исправление"></span>
      <span class="vn">${['В', 'Н'].map(x => `<label class="pill ${v === x ? 'on' : ''}"><input type="radio" name="${k}" value="${x}" data-a="${k}v" ${v === x ? 'checked' : ''} ${ro}>${x}</label>`).join('')}</span>
      <span class="tf-s">${i + 1}) ${p.s}</span></div>`;
  }
  if (p.t === 'mc') return `<p class="q">${t.n === 2 ? (i + 1) + ') ' : ''}${p.q}</p><div class="mc">${p.opts.map((o, j) => `<label class="ch ${A[k] === String(j) ? 'on' : ''}"><input type="radio" name="${k}" value="${j}" data-a="${k}" ${A[k] === String(j) ? 'checked' : ''} ${ro}><span class="lt">${'абвг'[j]})</span> ${o}</label>`).join('')}</div>`;
  if (p.t === 'sel') return `<div class="selrow ${p.long ? 'long' : ''}"><span class="sq">${p.q}</span><select data-a="${k}" ${ro}><option value="">— выберите —</option>${p.opts.map(o => opt(o, o, A[k])).join('')}</select></div>`;
  if (p.t === 'num') return `<div class="numrow"><span class="sq">${p.q}</span><input class="line num" inputmode="decimal" data-a="${k}" value="${esc(A[k])}" ${ro} placeholder="ответ"></div>`;
  if (p.t === 'grp') return `<table class="grp"><thead><tr><th>Объект</th>${p.cats.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>
      ${p.items.map(([name], j) => `<tr><td>${name}</td>${p.cats.map((_, c) => `<td class="c"><label class="pick"><input type="radio" name="${k}g${j}" value="${c}" data-a="${k}g${j}" ${A[k + 'g' + j] !== undefined && +A[k + 'g' + j] === c ? 'checked' : ''} ${ro}><span></span></label></td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
  if (p.t === 'ord') return `<p class="q">${p.q}</p><div class="ord">${p.show.map(j => `<div class="ordrow"><select data-a="${k}_${j}" ${ro}><option value="">№</option>${p.items.map((_, n) => opt(n + 1, n + 1, A[k + '_' + j])).join('')}</select><span>${p.items[j]}</span></div>`).join('')}</div>`;
  if (p.t === 'sch') return `<div class="scheme">${p.html.replace(/\{(\d)\}/g, (_, b) => `<select class="sc-sel" data-a="${k}_${b}" ${ro}><option value="">— выберите —</option>${p.opts.map(o => opt(o, o, A[k + '_' + b])).join('')}</select>`)}</div>`;
  if (p.t === 'op') return `<p class="q">${p.q}</p><textarea class="ruled" rows="4" data-a="${k}" ${ro}>${esc(A[k])}</textarea>`;
  return '';
}
/* extra(t, p, i) — блок под пунктом (разбор ученику / панель учителя) */
function blankHTML(v, mode, A = {}, extra = null) {
  let rows = '';
  tasksOf(v).forEach(t => {
    if (t.sec) rows += `<tr class="sec"><td colspan="3">${SECTIONS[t.sec]}</td></tr>`;
    rows += `<tr class="t-head"><td class="num" rowspan="${t.parts.length + 1}">${t.n}.</td>
      <td class="stem">${t.stem}${t.src ? `<blockquote class="src">${t.src}</blockquote>` : ''}${t.map ? mapHTML(t.map) : ''}${t.fig ? figHTML(t.fig) : ''}</td><td class="pts"><b>${t.p}</b> б.</td></tr>`;
    t.parts.forEach((p, i) => {
      rows += `<tr class="part" id="${key(t.n, i)}"><td class="body">${partHTML(t, p, i, mode, A)}${extra ? extra(t, p, i) : ''}</td><td class="pts">${scaleBoxes(t.n, i, maxOf(p))}</td></tr>`;
    });
  });
  rows += `<tr class="total"><td></td><td>Итого:</td><td class="pts"><b id="tTotal">${WORK.max} б.</b></td></tr>`;
  return `<table class="blank"><thead><tr><th>№</th><th>ЗАДАНИЯ</th><th>БАЛЛЫ</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="sign">Учитель _______________ Туманов Д.А.</p>`;
}
function paintBoxes(e, root = document) {
  e.items.forEach(x => root.querySelectorAll(`[data-k="${x.n}-${x.i}"]`).forEach(b => b.classList.toggle('on', x.score !== null && +b.dataset.v === x.score)));
}
function scaleTable() {
  const rows = SCALE.map(([min, g], i) => `<tr><td>«${g}»</td><td>${min}–${i === 0 ? WORK.max : SCALE[i - 1][0] - 1}</td></tr>`).join('');
  return `<table class="scale"><thead><tr><th>Отметка</th><th>Баллы</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- схема оценивания (для учителя) ---------- */
function crit(p) {
  return { tf: 'По 2 б. за каждое утверждение; 1 б., если правильно отмечена Н, но нет верного исправления.', mc: '1 б. за правильный ответ.',
    sel: '1 б. за каждое верное соответствие.', num: '1 б. за правильный ответ.', grp: `По 1 б. за каждый правильно отнесённый объект (всего ${maxOf(p)} б.).`,
    ord: 'По 1 б. за каждый элемент на своём месте.', sch: 'По 1 б. за каждый верно заполненный пропуск (в одной ветке — в любом порядке).',
    op: '2 б. — правильный и полный ответ; 1 б. — частично правильный; 0 б. — неверный ответ или нет ответа.' }[p.t];
}
function baremPage(v) {
  const rows = tasksOf(v).map(t => t.parts.map((p, i) => {
    const ans = p.t === 'op' ? p.m + ' <i>Допускаются и другие правильные ответы.</i>' : esc(modelText(p));
    const q = p.t === 'tf' ? `${i + 1})` : p.t === 'grp' ? 'Таблица' : p.t === 'sch' ? 'Схема' : p.t === 'ord' ? 'Порядок' : strip(p.q).slice(0, 60);
    return `<tr>${i === 0 ? `<td class="num" rowspan="${t.parts.length}">${t.n}</td><td class="pts" rowspan="${t.parts.length}">${t.p}</td>` : ''}<td><span class="bq">${esc(q)}</span><br>${ans}</td><td class="crit">${crit(p)}</td></tr>`;
  }).join('')).join('');
  return `<header class="blank-head"><p class="h-title">Схема оценивания</p><p class="h-sub">${WORK.title}</p><p class="h-var">Вариант № ${v + 1}</p></header>
    <table class="blank barem"><thead><tr><th>№</th><th>Баллы</th><th>Ожидаемый ответ</th><th>Критерии</th></tr></thead><tbody>${rows}
    <tr class="total"><td colspan="2">ИТОГО</td><td></td><td class="pts"><b>${WORK.max} б.</b></td></tr></tbody></table>
    <h3 class="sc-h">Шкала оценивания</h3>${scaleTable()}<p class="sign">Учитель: Туманов Д.А.</p>`;
}

/* сколько баллов проверяется автоматически и какие задания — развёрнутые */
const AUTO_MAX = v => tasksOf(v).reduce((s, t) => s + t.parts.filter(p => p.t !== 'op').reduce((a, p) => a + maxOf(p), 0), 0);
const OPEN_TASKS = v => tasksOf(v).filter(t => t.parts.some(p => p.t === 'op')).map(t => t.n);

/* ===== СТРАНИЦА УЧЕНИКА: результаты пишутся в results/geo11-kr1 (как во всех работах TechLab) ===== */
const LS_KEY = 'techlab_attempt_' + WORK.id;
const P = `results/${WORK.id}`;
let db = null, FB = null;
try {
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  FB = await import('./engine/rtdb.js?v=1');
  const { firebaseConfig } = await import('./firebase-config.js');
  db = FB.getDatabase(appMod.initializeApp(firebaseConfig));
} catch (e) { console.warn('Firebase недоступен', e); }

let WHO = null; try { WHO = JSON.parse(localStorage.getItem('techlab_student') || 'null'); } catch (e) {}
const PREVIEW = !WHO || !WHO.name;          // учитель смотрит без кода ученика — в базу ничего не пишем
let S = null, timerId = null, saveTimer = null, unwatch = null, MAN = {}, REVIEW = true;

const dl = () => S.deadline || (S.start + DURATION);
const saveLocal = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} };
const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } };
const dropLocal = () => { try { localStorage.removeItem(LS_KEY); } catch (e) {} };
const live = () => !PREVIEW && db && S && S.id;
const dbUpdate = (obj) => live() ? FB.update(FB.ref(db, `${P}/${S.id}`), obj).catch(e => console.warn(e)) : Promise.resolve();

/* ---------- запуск ---------- */
(async function init() {
  if (PREVIEW) document.body.insertAdjacentHTML('afterbegin', '<div class="pv">Режим просмотра учителя: работа не сохраняется в базу и не попадает в результаты.</div>');
  if (db) FB.onValue(FB.ref(db, `settings/${WORK.id}/review`), s => { const r = s.val() !== false; if (r !== REVIEW) { REVIEW = r; if (S?.finished) renderReview(); } });
  const prev = loadLocal();
  if (prev && prev.v !== undefined && (PREVIEW || prev.name === WHO.name)) {
    S = prev;
    if (live()) {
      try {
        const r = (await FB.get(FB.ref(db, `${P}/${S.id}`))).val();
        if (!r) { dropLocal(); S = null; return renderStart(); }
        MAN = r.manual || {};
        if (r.deadline) S.deadline = r.deadline;
        if (r.status === 'submitted') { S.finished = true; S.reason = r.reason || S.reason; S.end = r.submittedAt || S.end; saveLocal(); return renderReview(); }
        if (r.status === 'in_progress' && S.finished) { S.finished = false; saveLocal(); }
      } catch (e) {}
    }
    if (S.finished) return renderReview();
    if (Date.now() >= dl()) return finish('timeout');
    return renderResume();
  }
  renderStart();
})();

/* ---------- старт ---------- */
function renderStart(msg = '') {
  stopTimer(); document.body.classList.remove('mode-test', 'mode-review'); document.body.classList.add('mode-start');
  $('#app').innerHTML = `
  <section class="start"><div class="start-card">
    <p class="kicker">Суммативное оценивание · 11 класс</p>
    <h1>География</h1>
    <p class="sub">«Политическая карта мира. Природные условия и ресурсы»</p>
    <div class="facts"><div><b>45</b><span>минут</span></div><div><b>11</b><span>заданий</span></div><div><b>50</b><span>баллов</span></div><div><b>10</b><span>вариантов</span></div></div>
    <form id="startForm" autocomplete="off">
      <label>Фамилия, имя ученика<input id="fName" required maxlength="60" value="${esc(WHO?.name || '')}" ${WHO?.name ? 'readonly' : ''}></label>
      <label>Класс<input id="fClass" required maxlength="12" value="${esc(WHO?.cls || '')}" ${WHO?.cls ? 'readonly' : ''} placeholder="11 «А»"></label>
      ${PREVIEW ? `<label>Вариант (просмотр учителя)<select id="fVar">${VARIANTS.map((_, i) => `<option value="${i}">Вариант № ${i + 1}</option>`).join('')}</select></label>` : ''}
      <ul class="rules-list">
        <li>Вариант выдаётся случайно. Работа открывается во весь экран; выходы из окна фиксируются и видны учителю.</li>
        <li>Ответы сохраняются автоматически. Через 45 минут работа сдаётся сама.</li>
        <li>Задания с выбором и кратким ответом проверяются сразу; развёрнутые ответы (задания 9 и 11) проверяет учитель.</li>
      </ul>
      <div class="err" id="err">${esc(msg)}</div>
      <button class="btn primary big" type="submit" id="bStart">Начать работу</button>
    </form>
    <details class="rules"><summary>Шкала оценивания</summary>${scaleTable()}</details>
  </div></section>`;
  $('#startForm').onsubmit = async e => {
    e.preventDefault();
    const b = $('#bStart'); b.disabled = true; b.textContent = 'Подключение…';
    const name = $('#fName').value.trim().replace(/\s+/g, ' '), cls = $('#fClass').value.trim();
    const v = PREVIEW ? +$('#fVar').value : Math.floor(Math.random() * VARIANTS.length);
    const now = Date.now();
    S = { id: null, name, cls, v, start: now, deadline: now + DURATION, a: {}, leaves: 0, finished: false };
    if (!PREVIEW) {
      try {
        if (!db) throw new Error('no db');
        const open = (await FB.get(FB.ref(db, `settings/${WORK.id}/open`))).val();
        if (!open) { S = null; b.disabled = false; b.textContent = 'Начать работу'; $('#err').textContent = 'Работа ещё не открыта учителем. Подождите и нажмите ещё раз.'; return; }
        const r = FB.push(FB.ref(db, P));
        await FB.set(r, { name, cls, variant: v + 1, status: 'in_progress', startedAt: now, deadline: now + DURATION,
          updatedAt: FB.serverTimestamp(), violations: 0, answers: {}, ua: navigator.userAgent.slice(0, 120) });
        S.id = r.key;
      } catch (err) {
        console.error(err); S = null; b.disabled = false; b.textContent = 'Начать работу';
        $('#err').textContent = 'Нет связи с сервером. Проверьте интернет и нажмите ещё раз (или сообщите учителю).'; return;
      }
    }
    saveLocal(); goFull(); renderTest();
  };
}
function renderResume() {
  $('#app').innerHTML = `<section class="start"><div class="start-card"><p class="kicker">Работа не закончена</p><h1>Продолжение</h1>
    <p class="sub">${esc(S.name)}, ${esc(S.cls)} · вариант № ${S.v + 1}. Ответы сохранены, время идёт.</p>
    <button class="btn primary big" id="bCont" style="width:100%">Продолжить работу</button></div></section>`;
  $('#bCont').onclick = () => { goFull(); renderTest(); };
}
function goFull() { try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {} }

/* ---------- работа ---------- */
function renderTest() {
  document.body.classList.remove('mode-start', 'mode-review'); document.body.classList.add('mode-test');
  $('#app').innerHTML = `
  <div class="bar">
    <div class="bar-l"><b>Вариант № ${S.v + 1}</b><span>${esc(S.name)}, ${esc(S.cls)}</span></div>
    <div class="bar-c"><span id="prog"></span><div class="pbar"><i id="pfill"></i></div></div>
    <div class="bar-r"><span id="saved" class="saved"></span><span id="timer" class="timer">45:00</span><button class="btn primary" id="finishBtn">Сдать работу</button></div>
  </div>
  <main class="sheet">${headerBlock({ name: S.name, cls: S.cls, date: fmtDate(S.start), v: S.v })}${blankHTML(S.v, 'test', S.a)}
    <div class="end"><button class="btn primary big" id="finishBtn2">Сдать работу на проверку</button></div></main>
  <div id="toast" class="toast"></div>`;
  $('#app').oninput = $('#app').onchange = onInput; $('#app').onclick = null;
  $('#finishBtn').onclick = $('#finishBtn2').onclick = confirmFinish;
  progress(); startTimer(); watchRecord();
}
function onInput(e) {
  const el = e.target, a = el.dataset?.a;
  if (!a || !S || S.finished) return;
  if (el.type === 'radio') { if (el.checked) S.a[a] = el.value; } else S.a[a] = el.value;
  if (el.type === 'radio') el.closest('.vn,.mc')?.querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  saveLocal(); progress();
  clearTimeout(saveTimer); if ($('#saved')) $('#saved').textContent = '';
  saveTimer = setTimeout(() => dbUpdate({ answers: S.a, updatedAt: Date.now() }).then(() => { if ($('#saved') && live()) $('#saved').textContent = '✓ сохранено'; }), 2500);
}
function answered(p, k) {
  if (p.t === 'grp') return p.items.every((_, j) => S.a[k + 'g' + j] !== undefined);
  if (p.t === 'ord') return p.items.every((_, j) => S.a[k + '_' + j]);
  if (p.t === 'sch') return p.ans.every((_, b) => S.a[k + '_' + b]);
  return !!norm(answerText(p, k, S.a));
}
function progress() {
  let all = 0, done = 0;
  tasksOf(S.v).forEach(t => t.parts.forEach((p, i) => { all++; if (answered(p, key(t.n, i))) done++; }));
  $('#prog').textContent = `Выполнено: ${done} из ${all}`; $('#pfill').style.width = (done / all * 100) + '%';
}
function startTimer() {
  stopTimer();
  const tick = () => {
    const left = dl() - Date.now(), t = $('#timer');
    if (left <= 0) { finish('timeout'); return; }
    if (!t) return;
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    t.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    t.classList.toggle('warn', left < 5 * 60000);
    if (m === 5 && s === 0) toast('Осталось 5 минут. Проверьте свои ответы.');
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function toast(msg) { const t = $('#toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }

const testing = () => document.body.classList.contains('mode-test') && S && !S.finished;
document.addEventListener('visibilitychange', () => {
  if (!testing()) return;
  if (document.hidden) {
    S.leaves++; saveLocal();
    if (live()) { const ek = FB.push(FB.ref(db, `${P}/${S.id}/events`)).key; dbUpdate({ violations: S.leaves, [`events/${ek}`]: { type: 'tab', at: Date.now() } }); }
  } else toast(`Вы покидали окно работы: ${S.leaves} раз(а). Учитель это видит.`);
});
document.addEventListener('contextmenu', e => { if (testing()) e.preventDefault(); });
document.addEventListener('copy', e => { if (testing() && !e.target.closest?.('input,textarea')) e.preventDefault(); });

function confirmFinish() {
  let empty = 0; tasksOf(S.v).forEach(t => t.parts.forEach((p, i) => { if (!answered(p, key(t.n, i))) empty++; }));
  modal(`<h3>Сдать работу?</h3><p>${empty ? `Без ответа осталось пунктов: <b>${empty}</b>.` : 'Вы ответили на все пункты.'} После сдачи изменить ответы будет нельзя.</p>`,
    [['Вернуться к работе', null], ['Сдать работу', () => finish('manual')]]);
}
function modal(html, buttons) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="mbox">${html}<div class="mbtns"></div></div>`;
  buttons.forEach(([label, fn], i) => { const b = document.createElement('button'); b.className = 'btn ' + (i === buttons.length - 1 ? 'primary' : ''); b.textContent = label; b.onclick = () => { m.remove(); fn && fn(); }; m.querySelector('.mbtns').appendChild(b); });
  document.body.appendChild(m);
}
async function finish(reason) {
  if (!S || S.finished) return;
  stopTimer(); clearTimeout(saveTimer);
  S.finished = true; S.end = Math.min(Date.now(), dl()); S.reason = reason; saveLocal();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  await dbUpdate({ answers: S.a, status: 'submitted', reason, submittedAt: S.end, updatedAt: Date.now(), violations: S.leaves, result: resultOf(S.v, S.a, MAN) });
  renderReview();
}

/* ---------- учитель может завершить, заблокировать, разрешить продолжить, поставить баллы ---------- */
function watchRecord() {
  if (!live() || unwatch) return;
  unwatch = FB.onValue(FB.ref(db, `${P}/${S.id}`), snap => {
    const r = snap.val(); if (!r || !S) return;
    const m = r.manual || {}, manChanged = JSON.stringify(m) !== JSON.stringify(MAN); MAN = m;
    if (r.status === 'submitted' && !S.finished) {
      stopTimer(); clearTimeout(saveTimer);
      S.finished = true; S.reason = r.reason || 'teacher'; S.end = r.submittedAt || Date.now(); saveLocal();
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      dbUpdate({ answers: S.a, result: resultOf(S.v, S.a, MAN) });
      return renderReview();
    }
    if (r.status === 'in_progress' && S.finished) { S.finished = false; S.reason = null; S.deadline = r.deadline || dl(); saveLocal(); goFull(); return renderTest(); }
    if (manChanged && S.finished && document.body.classList.contains('mode-review')) renderReview();
  });
}

/* ---------- после сдачи: результат и разбор с пояснениями ---------- */
function reviewBlock(t, p, i) {
  const k = key(t.n, i), sc = Number.isFinite(MAN[k]) ? MAN[k] : autoOf(p, k, S.a), max = maxOf(p);
  if (p.t === 'op') {
    if (!norm(S.a[k])) return `<div class="rv bad"><b>Нет ответа — 0 б.</b>${REVIEW ? `<div class="model"><span>Образец ответа:</span> ${p.m}</div>` : ''}</div>`;
    if (!Number.isFinite(MAN[k])) return `<div class="rv self"><b>⏳ Этот ответ проверит учитель.</b></div>`;
    return `<div class="rv ${MAN[k] === max ? 'good' : MAN[k] ? 'mid' : 'bad'}"><b>Учитель: ${MAN[k]} из ${max} б.</b>${REVIEW ? `<div class="model"><span>Образец ответа:</span> ${p.m}</div>` : ''}</div>`;
  }
  const ok = sc === max;
  return `<div class="rv ${ok ? 'good' : sc > 0 ? 'mid' : 'bad'}"><b>${ok ? '✓' : sc > 0 ? '◐' : '✗'} ${sc} из ${max} б.</b>
    ${REVIEW && !ok ? `<div class="model"><span>Правильный ответ:</span> ${esc(modelText(p))}</div>` : ''}
    ${REVIEW && p.ex ? `<div class="ex">💡 ${p.ex}</div>` : ''}</div>`;
}
function renderReview() {
  stopTimer(); document.body.classList.remove('mode-start', 'mode-test'); document.body.classList.add('mode-review');
  $('#app').innerHTML = `
  <div class="bar"><div class="bar-l"><b>Вариант № ${S.v + 1}</b><span>${esc(S.name)}, ${esc(S.cls)}</span></div>
    <div class="bar-c"><span id="sumLine"></span></div>
    <div class="bar-r"><button class="btn" id="printBtn">Печать / PDF</button><a class="btn" href="./">На главную</a></div></div>
  <main class="sheet"><section class="result" id="result"></section>
    ${headerBlock({ name: S.name, cls: S.cls, date: fmtDate(S.start), v: S.v, score: '', mark: '' })}${blankHTML(S.v, 'review', S.a, reviewBlock)}</main>`;
  $('#printBtn').onclick = () => window.print();
  $('#app').oninput = $('#app').onchange = $('#app').onclick = null;
  const e = evaluate(S.v, S.a, MAN), done = e.complete, pct = Math.round(e.total / WORK.max * 100);
  paintBoxes(e);
  $('#hScore').textContent = done ? e.total : e.total + '+'; $('#hMark').textContent = done ? e.grade : '…';
  $('#tTotal').textContent = done ? `${e.total} из ${WORK.max}` : `${e.total}+ из ${WORK.max}`;
  $('#sumLine').textContent = done ? `Итог: ${e.total} из ${WORK.max} · отметка «${e.grade}»` : `Предварительно: ${e.total} из ${WORK.max} · ждёт проверки учителем`;
  const mins = Math.max(1, Math.round(((S.end || Date.now()) - S.start) / 60000));
  $('#result').innerHTML = `
    <div class="res-top">
      <div class="res-mark ${done ? '' : 'wait'}"><span>Отметка</span><b>${done ? e.grade : '?'}</b></div>
      <div class="res-main">
        <h2>${done ? `${e.total} из ${WORK.max} баллов · ${pct}%` : `Работа сдана · автопроверка: ${e.total} из ${AUTO_MAX(S.v)} баллов`}</h2>
        <p>${done ? 'Работа проверена полностью.' : `Задания с выбором и кратким ответом проверены автоматически. Развёрнутые ответы (задания ${OPEN_TASKS(S.v).join(' и ')}, ${WORK.max - AUTO_MAX(S.v)} баллов) проверит учитель — после этого появится отметка.`}
          ${REVIEW ? ' Ниже — разбор: правильные ответы и пояснения.' : ' Разбор ответов учитель откроет позже.'}</p>
        ${S.reason === 'blocked' ? '<p class="stopmsg">⛔ Работа остановлена учителем.</p>' : S.reason === 'teacher' ? '<p class="stopmsg">⏹ Работа завершена учителем. Засчитаны сохранённые ответы.</p>' : ''}
        <p class="meta">Время работы: ${mins} мин${S.reason === 'timeout' ? ' (время истекло)' : ''} · Выходов из окна: <b class="${S.leaves ? 'warnc' : ''}">${S.leaves}</b></p>
      </div>
    </div>
    <div class="res-grid">${[1, 2, 3].map(s => `<div class="rsec"><span>${SECTIONS[s]}</span><b>${e.secs[s][0]} / ${e.secs[s][1]}</b><div class="pbar"><i style="width:${e.secs[s][0] / e.secs[s][1] * 100}%"></i></div></div>`).join('')}</div>
    <div class="res-tasks">${e.tasks.map(t => `<a href="#${key(t.n, 0)}" class="${t.pending ? '' : t.sum === t.max ? 'full' : t.sum === 0 ? 'zero' : ''}">№${t.n}<b>${t.pending ? '⏳' : t.sum + '/' + t.max}</b></a>`).join('')}</div>`;
  watchRecord();
}

</script>
</body>

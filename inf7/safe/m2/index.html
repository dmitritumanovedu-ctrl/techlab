<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Миссия 2 · Защити свою цифровую комнату · 7 класс</title>
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
  :root{
    --blue:#1e5bd8; --blue2:#3aa0ff; --bg:#eef5ff; --card:#fff; --ink:#16233f; --muted:#5b6b8c;
    --ok:#16a34a; --bad:#dc2626; --warn:#f59e0b; --line:#d6e4fb; --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
  header.top{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(30,91,216,.25)}
  .brand{font-size:20px;font-weight:600;letter-spacing:.3px}
  .who{opacity:.95;font-size:15px}
  .back{color:#fff;text-decoration:none;font-weight:600;opacity:.9}
  .linkbtn{background:rgba(255,255,255,.18);padding:6px 12px;font-size:13px;border-radius:10px}
  .shield{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
  .bar{width:200px;height:14px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84d,#5df58a);transition:width .8s}
  #shieldPct{font-size:20px;min-width:52px;text-align:right}
  nav.steps{display:flex;gap:6px;padding:12px 24px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:13px;background:#eef2f9;color:#8592ad}
  .chip.done{background:#dcfce7;color:#166534}
  .chip.cur{background:var(--blue);color:#fff;font-weight:600}
  main{max-width:1060px;margin:24px auto;padding:0 18px 60px}
  .card{background:var(--card);border-radius:var(--r);padding:26px 28px;box-shadow:0 6px 22px rgba(22,35,63,.07);margin-bottom:18px}
  h1{font-size:28px;margin:0 0 6px} h2{font-size:23px;margin:0 0 8px} h3{margin:18px 0 8px}
  .lead{color:var(--muted);margin:0 0 16px}
  .mission-tag{display:inline-block;background:#e6efff;color:var(--blue);font-weight:600;font-size:13px;border-radius:12px;padding:4px 10px;margin-bottom:10px}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;background:var(--blue);color:#fff;font-weight:600;transition:.15s}
  button:hover{filter:brightness(1.08)} button:disabled{background:#b9c6de;cursor:not-allowed}
  button.ghost{background:#eef2f9;color:var(--ink)}
  button.big{font-size:19px;padding:14px 30px}
  input[type=text],input[type=number],textarea,select{font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fbfdff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue2)}
  label.cb{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#f5f8ff;margin:8px 0;cursor:pointer}
  label.cb input{width:20px;height:20px;margin-top:2px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}.bar{width:120px}}
  .note{background:#fff8e1;border-left:5px solid var(--warn);padding:12px 16px;border-radius:10px;margin:12px 0}
  .good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
  .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);background:#16233f;color:#fff;padding:14px 22px;border-radius:14px;font-weight:600;transition:.35s;z-index:20}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* рабочий лист */
  .sheet{border:2px dashed var(--line);border-radius:14px;padding:18px 20px;background:#fbfdff}
  .sheet .date{font-size:22px;font-weight:700;color:var(--blue)}
  .sheet .topic{font-size:21px;font-weight:700;margin:6px 0 12px}
  .plan li{margin:4px 0}

  /* комната */
  .room-svg{width:100%;height:auto;border-radius:14px;display:block;user-select:none}
  .room-svg [data-hot]{cursor:pointer}
  .mk{display:none}.mk.found,.mk.missed,.reveal .mk{display:block}
  .mk-c{fill:#16a34a;stroke:#fff;stroke-width:3}.mk.missed .mk-c{fill:#dc2626}
  .mk-t{fill:#fff;font-weight:700;font-size:16px;font-family:Arial}
  .found-list{list-style:none;padding:0;margin:12px 0 0}
  .found-list li{padding:9px 12px;border-radius:10px;margin:6px 0;background:#f0fdf4}
  .found-list li.miss{background:#fef2f2}
  .counter{font-size:20px;font-weight:700}
  .shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* почта */
  .mail{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
  .mail .from{font-weight:700}.mail .addr{color:var(--muted);font-size:14px}
  .mail .subj{margin:6px 0;font-weight:600}.mail .txt{color:#33415e}
  .mail .btns{display:flex;gap:10px;margin-top:10px}
  .mail .btns button{padding:9px 16px;background:#eef2f9;color:var(--ink)}
  .mail .btns button.sel.safe{background:var(--ok);color:#fff}
  .mail .btns button.sel.phish{background:var(--bad);color:#fff}
  .mail.right{border-color:var(--ok);background:#f0fdf4}.mail.wrong{border-color:var(--bad);background:#fef2f2}
  .why{margin-top:8px;font-size:15px}

  /* замок */
  .meter{height:18px;border-radius:10px;background:#e5eaf3;overflow:hidden;margin:12px 0}
  .meter i{display:block;height:100%;width:0;transition:.3s}
  .crack{font-size:24px;font-weight:700}
  .rules li{list-style:none;margin:5px 0}.rules{padding:0}

  /* профиль */
  .pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#f5f8ff;margin:7px 0}
  .pitem .lbl{flex:1}.pitem .lbl small{display:block;color:var(--muted)}
  .tog{display:flex;border-radius:10px;overflow:hidden}
  .tog button{border-radius:0;padding:7px 12px;font-size:14px;background:#e2e8f3;color:#334}
  .tog button.on.pub{background:#2563eb;color:#fff}.tog button.on.hid{background:#334155;color:#fff}
  .pitem.right{background:#f0fdf4}.pitem.wrong{background:#fef2f2}
  .social{border-radius:16px;overflow:hidden;border:2px solid var(--line);position:sticky;top:120px}
  .social .cover{height:70px;background:linear-gradient(90deg,#8b5cf6,#ec4899)}
  .social .body{padding:0 16px 16px}
  .social .ava{width:72px;height:72px;border-radius:50%;background:#fff3e0;border:4px solid #fff;margin-top:-36px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .social .line{padding:7px 10px;border-radius:8px;margin:5px 0;font-size:15px;background:#f8fafc}
  .social .line.danger{background:#fee2e2;color:#991b1b}

  /* рабочее место */
  .desk-svg{width:100%;height:auto;background:#f5f8ff;border-radius:14px}
  .ctl{margin:12px 0}.ctl .top{display:flex;justify-content:space-between;font-weight:600}
  input[type=range]{width:100%}
  .st{font-size:14px}

  /* глаза */
  .eyes{position:relative;height:300px;border-radius:16px;background:linear-gradient(180deg,#0e1a33,#1c2e57);overflow:hidden}
  .eyes .dot{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff,#5df58a);box-shadow:0 0 24px #5df58a;transform:translate(-50%,-50%)}
  .eyes .cap{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:20px;font-weight:600}
  .eyes .tm{position:absolute;bottom:12px;right:18px;color:#9fb3dc;font-size:18px}

  /* тест */
  .q{padding:14px 16px;border-radius:14px;background:#f8faff;margin:12px 0}
  .q .qt{font-weight:600;margin-bottom:8px}
  .q label{display:block;padding:8px 10px;border-radius:10px;cursor:pointer;margin:3px 0}
  .q label:hover{background:#eaf1ff}
  .q label.c{background:#dcfce7}.q label.x{background:#fee2e2}

  /* рефлексия */
  .emo{display:flex;gap:14px;flex-wrap:wrap}
  .emo button{background:#f1f5fb;color:var(--ink);font-size:16px;padding:14px 18px;border:3px solid transparent}
  .emo button span{font-size:34px;display:block}
  .emo button.on{border-color:var(--blue);background:#e6efff}

  /* паспорт */
  .passport{border-radius:22px;padding:30px;background:linear-gradient(135deg,#1e5bd8,#3aa0ff 60%,#5df5c9);color:#fff;position:relative;overflow:hidden}
  .passport h1{font-size:30px}.passport .nm{font-size:26px;font-weight:700;margin:6px 0}
  .passport .big{font-size:64px;font-weight:800;line-height:1}
  .passport .badges{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
  .passport .bd{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:14px}
  .passport .rules2{background:rgba(255,255,255,.15);border-radius:14px;padding:12px 18px}
  .passport::after{content:"🛡️";position:absolute;right:20px;top:10px;font-size:110px;opacity:.25}
  @media print{header,nav,.actions,.noprint{display:none!important}body{background:#fff}main{margin:0}.passport{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

/* Связь миссии с сайтом TechLab: результаты попадают в «Центр управления» */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../../firebase-config.js";
const MISSION_ID = "inf7-safe-m2";
const db = getDatabase(initializeApp(firebaseConfig));
const P = `results/${MISSION_ID}`;
window.__tlr({
  isOpen: async () => !!(await get(ref(db, `settings/${MISSION_ID}/open`))).val(),
  start: async (d) => { const r = push(ref(db, P)); await set(r, { ...d, status: "in_progress", stage: "Рабочий лист", score: {}, startedAt: Date.now(), updatedAt: serverTimestamp() }); return r.key; },
  progress: (id, o) => update(ref(db, `${P}/${id}`), { ...o, updatedAt: serverTimestamp() }),
  submit: (id, o) => update(ref(db, `${P}/${id}`), { ...o, status: "submitted", submittedAt: Date.now(), updatedAt: serverTimestamp() }),
});
</script>

  }

  /* ---------- 4. МИССИЯ «ПОЧТОВЫЙ ЯЩИК» ---------- */
  const MAIL = [
    { id: 'm1', from: 'Instagram Support', addr: 'security@insta-help-support.com',

      phish: true, why: 'Срочность и угроза, чужой адрес (не instagram.com), просят пароль — классический фишинг.' },

      subj: 'Экскурсия в пятницу',
      text: 'Напоминаю: в пятницу экскурсия в Национальный музей. Сбор в 8:15 у школы. Не опаздывайте!',
      phish: false, why: 'Знакомый отправитель, ничего не просит: ни паролей, ни денег, ни перехода по ссылке.' },
    { id: 'm3', from: '+373 6•• ••• •••', addr: 'SMS',
      subj: 'Поздравляем! 🎁',
      text: 'Вы выиграли iPhone 17! Оплатите только доставку — 50 лей: bit.ly/iph0ne-win',
      phish: true, why: '«Выигрыш» в конкурсе, где ты не участвовал, просьба заплатить и короткая ссылка — признаки мошенничества.' },
    { id: 'm4', from: 'Steam', addr: 'support@steamcommunlty.com',
      subj: 'Друг отправил тебе подарок',
      text: 'Войди в свой аккаунт по ссылке, чтобы получить игру в подарок.',
      phish: true, why: 'Подмена буквы в адресе: steamcommun<b>l</b>ty вместо steamcommun<b>i</b>ty. Это поддельный сайт для кражи аккаунта.' },
    { id: 'm5', from: 'Игрок «Pro_Gamer228»', addr: 'Чат в игре',
      subj: 'Помоги, плиз 🙏',
      text: 'Я по ошибке отправил код из SMS на твой номер. Скинь его мне, пожалуйста!',
      phish: true, why: 'Коды из SMS никому нельзя сообщать — именно так угоняют аккаунты.' },
    { id: 'm6', from: 'Google', addr: 'no-reply@accounts.google.com',
      subj: 'Новый вход в аккаунт',
      text: 'Выполнен вход с устройства Windows (Кишинёв). Если это были вы, ничего делать не нужно.',
      phish: false, why: 'Официальный адрес, ничего не просит ввести. Если вход был не твой — сам открой сайт Google и смени пароль.' }
  ];

  /* ---------- 5. МИССИЯ «МОЙ ПРОФИЛЬ» ---------- */
  const PROFILE = [
    { id: 'nick',    label: 'Никнейм',               val: 'Star_Fox',                    hide: false },
    { id: 'phone',   label: 'Номер телефона',        val: '+373 69 ••• •••',             hide: true,  why: 'Номер используют мошенники для звонков и SMS, по нему находят другие твои аккаунты.' },
    { id: 'music',   label: 'Любимая музыка',        val: 'Imagine Dragons',             hide: false },
    { id: 'address', label: 'Домашний адрес',        val: 'ул. Садовая, 12, кв. 5',      hide: true,  why: 'Адрес — это место, где тебя можно найти. Его не публикуют.' },
    { id: 'school',  label: 'Школа и класс',         val: 'Лицей, 7 «Б»',                hide: true,  why: 'Незнакомец узнает, где тебя найти каждый день.' },
    { id: 'hobby',   label: 'Хобби',                 val: 'Рисую комиксы',               hide: false },
    { id: 'geo',     label: 'Фото у дома с геометкой', val: '📍 фото у подъезда',        hide: true,  why: 'Геометка показывает точное место, где ты живёшь.' },
    { id: 'trip',    label: 'Пост',                  val: '«Уезжаем всей семьёй на 2 недели на море! Квартира пустая 😄»', hide: true, why: 'Ворам станет известно, что дома никого нет.' },
    { id: 'avatar',  label: 'Аватар',                val: '🦊 рисунок лисы',             hide: false },
    { id: 'bday',    label: 'Полная дата рождения',  val: '14.03.2013',                  hide: true,  why: 'Дату рождения используют для подбора паролей и «секретных вопросов».' }
  ];

  /* ---------- 6. ТЕСТ ---------- */
  const TEST = [
    { q: 'Каким должно быть расстояние от глаз до монитора?',
      a: ['20–30 см', '50–70 см', '100–120 см', 'Любым, как удобно'], c: 1,
      why: 'Оптимально 50–70 см — примерно длина вытянутой руки.' },
    { q: 'Что означает правило «20-20-20»?',
      a: ['Работать 20 минут в день', 'Каждые 20 минут 20 секунд смотреть вдаль (около 6 м)', 'Сидеть в 20 см от экрана', 'Делать 20 приседаний каждые 20 минут'], c: 1,
      why: 'Каждые 20 минут — 20 секунд смотреть на предмет примерно в 6 метрах (20 футах). Глаза расслабляются.' },
    { q: 'Какой пароль самый надёжный?',
      a: ['12345678', 'Ivan2013', 'Kot!Luna_7*Plyazh', 'qwerty'], c: 2,
      why: 'Длинный, с буквами разного регистра, цифрами и символами, без имени и даты рождения.' },
    { q: 'Двухфакторная аутентификация — это…',
      a: ['Два одинаковых пароля', 'Вход по паролю + дополнительный код (SMS или приложение)', 'Вход с двух компьютеров', 'Пароль из двух слов'], c: 1,
      why: 'Даже если пароль украли, без второго кода войти не получится.' },
    { q: 'Пишут: «Срочно! Аккаунт заблокируют, перейди по ссылке и введи пароль». Это…',
      a: ['Забота службы поддержки', 'Фишинг', 'Обычная рассылка', 'Обновление программы'], c: 1,
      why: 'Срочность + ссылка + просьба ввести пароль = фишинг.' },
    { q: 'Что МОЖНО публиковать в открытом профиле?',
      a: ['Домашний адрес', 'Номер школы и класс', 'Любимую книгу', 'Фото билета на самолёт'], c: 2,
      why: 'Интересы безопасны; адрес, школа и билеты (с кодом брони и датами) — нет.' },
    { q: 'Цифровой след — это…',
      a: ['След от пальца на экране', 'Вся информация о тебе в интернете, которую трудно удалить', 'История звонков', 'Размер файла'], c: 1,
      why: 'Посты, фото, комментарии, лайки — всё это остаётся в сети надолго.' },
    { q: 'Как правильно сидеть за компьютером?',
      a: ['Спина опирается на спинку, ступни на полу, колени примерно под 90°', 'Положив ногу на ногу', 'Наклонившись к экрану', 'На краю стула'], c: 0,
      why: 'Правильная посадка бережёт спину, шею и глаза.' }
  ];

  return { CLASSES, STEPS, mark, rank, ERRORS, roomSvg, MAIL, PROFILE, TEST };
})();

</script>
<script>
(function(){
  const E = window.ERGO;
  const KEY = 'techlab_inf7_m2';
  const $ = s => document.querySelector(s);
  const main = $('#main');
  const params = new URLSearchParams(location.search);

  let S = load();
  let confirmed = false;   // на общем компьютере каждый раз спрашиваем «это ты?»
  function load(){ try{ const v=JSON.parse(localStorage.getItem(KEY)); if(v && v.name && Date.now()-(v.started||0) < 4*3600*1000) return v; localStorage.removeItem(KEY); }catch(e){} return null; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} sync(); paintHeader(); }
  function total(){ return S ? Object.values(S.pts||{}).reduce((a,b)=>a+b,0) : 0; }
  function stepIdx(id){ return E.STEPS.findIndex(s=>s.id===id); }
  function esc(t){ return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function today(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
  function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }

  /* связь с TechLab: результаты сразу попадают в «Центр управления» учителя */
  function TL(){ return Promise.race([window.TL_READY, new Promise((_,rej)=>setTimeout(()=>rej(new Error('нет связи')),10000))]); }
  function minutes(){ return Math.max(1, Math.round((Date.now()-S.started)/60000)); }
  function sync(){
    if(!S || !S.rec || S.sent) return;
    TL().then(t=>t.progress(S.rec,{ score:S.pts, stage:E.STEPS[S.step].title, doneCount:Math.max(0,S.step-1), idea:S.data.idea||'', details:S.data })).catch(()=>{});
  }
  function submitFinal(){
    if(!S || !S.rec) return Promise.reject(new Error('нет записи'));
    if(S.sent) return Promise.resolve();
    const d=S.data;
    return TL().then(t=>t.submit(S.rec,{ score:S.pts, stage:'Цифровой паспорт', total:total(), minutes:minutes(),
      mood:d.moodText||'', idea:d.idea||'', learned:d.learned||'', change:d.change||'', details:d })).then(()=>{ S.sent=1; save(); });
  }

  function paintHeader(){
    const p = total();
    $('#shieldBar').style.width = p+'%';
    $('#shieldPct').textContent = p+'%';
    $('#who').textContent = S && S.name ? `${S.name} · ${S.cls}` : '';
    $('#stepsNav').innerHTML = E.STEPS.map((s,i)=>{
      const cls = !S ? (i===0?'cur':'') : (i<S.step?'done':(i===S.step?'cur':''));
      return `<span class="chip ${cls}">${s.icon} ${s.title}</span>`;
    }).join('');
  }

  function finishStep(id, pts, extra){
    S.pts[id] = pts;
    if(extra) Object.assign(S.data, extra);
    save();
    toast(`+${pts} к защите комнаты! 🛡️`);
  }
  function next(){ S.step++; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

  function render(){
    paintHeader();
    const id = (S && confirmed) ? E.STEPS[S.step].id : 'start';
    ({start, notebook, room, mail, lock, profile, desk, eyes, test, reflect, passport})[id]();
  }

  /* ---------- ВХОД ---------- */
  function start(){
    if(S && S.name){
      main.innerHTML = `<div class="card"><h1>С возвращением, ${esc(S.name)}! 👋</h1>
        <p class="lead">Твоя комната сохранена — продолжай с того места, где остановился(ась).</p>
        <div class="actions" style="justify-content:flex-start"><button class="big" id="cont">Продолжить</button>
        <button class="ghost" id="notme">Это не я — начать заново</button></div></div>`;
      $('#cont').onclick = ()=>{ confirmed=true; render(); };
      $('#notme').onclick = ()=>{ if(confirm('Начать миссию заново под другим именем?')){ localStorage.removeItem(KEY); S=null; render(); } };
      return;
    }
    main.innerHTML = `<div class="card">
      <span class="mission-tag">🛡 Экспедиция «Цифровой щит» · Миссия 2 · Тревога! 🚨</span>
      <h1>Защити свою цифровую комнату</h1>
      <p class="lead">В твою комнату пытаются проникнуть. Её защита сейчас — <b>0%</b>.
      Выполняй миссии, и с каждой защита будет расти. В конце ты получишь <b>Цифровой паспорт</b>.</p>
      <form id="login" novalidate><div class="grid2">
        <div><label for="fio">Фамилия и имя</label><input type="text" id="fio" autocomplete="off" maxlength="60" placeholder="Например: Руссу Анна"></div>
        <div><label for="cls">Класс</label><select id="cls"><option value="">выбери…</option>${E.CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></div>
      </div>
      <p class="badc" id="err" style="min-height:24px;margin:12px 0 0"></p>
      <div class="actions"><button class="big" id="go" type="submit">Войти в комнату →</button></div></form></div>`;
    $('#login').onsubmit = (ev)=>{
      ev.preventDefault();
      const n = $('#fio').value.trim().replace(/\s+/g,' '), cls=$('#cls').value, err=$('#err'), btn=$('#go');
      if(n.split(' ').length<2){ err.textContent='Напиши фамилию и имя полностью, через пробел.'; $('#fio').focus(); return; }
      if(!cls){ err.textContent='Выбери свой класс.'; $('#cls').focus(); return; }
      err.textContent='Подключаюсь к TechLab…'; btn.disabled=true;
      TL().then(async t=>{
        if(!(await t.isOpen())){ err.textContent='🔒 Миссия ещё не открыта учителем. Подожди и нажми ещё раз.'; btn.disabled=false; return; }
        const rec = await t.start({ name:n, cls });
        S = { name:n, cls, rec, sid:rec, step:1, pts:{}, data:{}, started:Date.now(), sent:0 };
        confirmed = true; save(); render();
      }).catch(()=>{ err.textContent='Нет связи с сайтом. Проверь интернет и нажми ещё раз.'; btn.disabled=false; });
    };
  }

  /* ---------- 1. РАБОЧИЙ ЛИСТ ---------- */
  function notebook(){
    main.innerHTML = `<div class="card">
      <span class="mission-tag">Шаг 1 · Рабочий лист урока</span>
      <h2>Запиши в тетрадь число и тему урока</h2>
      <div class="sheet">
        <div class="date">${today()}</div>
        <div class="topic">Эргономика и личная безопасность в цифровых средах</div>
        <b>Сегодня ты научишься:</b>
        <ul class="plan">
          <li>правильно организовывать рабочее место за компьютером;</li>
          <li>беречь глаза, спину и осанку;</li>
          <li>создавать надёжный пароль;</li>
          <li>распознавать фишинг и мошеннические сообщения;</li>
          <li>защищать свои личные данные в сети.</li>
        </ul>
        <b>План урока (миссии):</b>
        <ol class="plan">${E.STEPS.filter(s=>s.max&&s.id!=='notebook').map(s=>`<li>${s.icon} ${s.title} — до ${s.max} баллов</li>`).join('')}</ol>
      </div>
      <label class="cb"><input type="checkbox" id="wrote"> <span>Я записал(а) в тетрадь <b>число</b> и <b>тему урока</b></span></label>
      <h3>Вопрос-разминка</h3>
      <p>Как ты думаешь, что изучает <b>эргономика</b>? Напиши своё предположение — проверим его на уроке.</p>
      <textarea id="idea" rows="2" placeholder="Я думаю, эргономика — это…"></textarea>
      <div class="actions"><button class="big" id="ok">Начать квест →</button></div></div>`;
    $('#ok').onclick = ()=>{
      if(!$('#wrote').checked){ toast('Сначала запиши число и тему в тетрадь ✍️'); return; }
      const idea=$('#idea').value.trim();
      if(idea.length<5){ toast('Напиши своё предположение'); $('#idea').focus(); return; }
      finishStep('notebook', 4, { idea }); next();
    };
  }

  /* ---------- 2. НАЙДИ ОШИБКИ ---------- */
  function room(){
    const found = new Set(); let miss=0, done=false;
    main.innerHTML = `<div class="card">
      <span class="mission-tag">Миссия 1 · ${E.STEPS[2].icon} Найди ошибки</span>
      <h2>Это комната горе-геймера. Найди 8 опасных ошибок!</h2>
      <p class="lead">Нажимай на предметы, которые вредят здоровью или безопасности.</p>
      <div id="roomWrap">${E.roomSvg(true)}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px">
        <div class="counter">Найдено: <span id="cnt">0</span> из 8</div>
        <button id="fin">Завершить миссию</button>
      </div>
      <ul class="found-list" id="fl"></ul>
      <div class="actions"><button class="big" id="nx" style="display:none">Дальше →</button></div></div>`;
    const svg = main.querySelector('.room-svg');
    svg.addEventListener('click', ev=>{
      if(done) return;
      const t = ev.target.closest('[data-hot]');
      if(!t){ miss++; svg.classList.remove('shake'); void svg.offsetWidth; svg.classList.add('shake'); return; }
      const id=t.getAttribute('data-hot'); if(found.has(id)) return;
      found.add(id); svg.querySelector('#mk-'+id).classList.add('found');
      const e=E.ERRORS.find(x=>x.id===id), n=E.ERRORS.indexOf(e)+1;
      $('#fl').insertAdjacentHTML('beforeend',`<li><b>${n}. ${e.title}.</b> ${e.tip}</li>`);
      $('#cnt').textContent=found.size;
      if(found.size===8){ toast('Все ошибки найдены! 🎉'); finish(); }
    });
    $('#fin').onclick = ()=>{ if(found.size<8 && !confirm(`Найдено ${found.size} из 8. Завершить миссию?`)) return; finish(); };
    function finish(){
      if(done) return; done=true;
      E.ERRORS.forEach((e,i)=>{ if(!found.has(e.id)){ svg.querySelector('#mk-'+e.id).classList.add('missed');
        $('#fl').insertAdjacentHTML('beforeend',`<li class="miss"><b>${i+1}. ${e.title} (пропущено).</b> ${e.tip}</li>`);} });
      $('#fin').style.display='none'; $('#nx').style.display='';
      finishStep('room', found.size*2, { roomFound:[...found], roomMiss:miss });
    }
    $('#nx').onclick = next;
  }

  /* ---------- 3. ПОЧТОВЫЙ ЯЩИК ---------- */
  function mail(){
    const ans={};
    main.innerHTML = `<div class="card">
      <span class="mission-tag">Миссия 2 · 📨 Почтовый ящик</span>
      <h2>В твою комнату пришли сообщения. Где ловушка?</h2>
      <p class="lead">Отметь каждое сообщение: <b>безопасно</b> или <b>фишинг</b> (попытка обмана, чтобы украсть данные или деньги).</p>
      <div id="box">${E.MAIL.map(m=>`<div class="mail" id="ml-${m.id}">
        <div class="from">${esc(m.from)} <span class="addr">&lt;${esc(m.addr)}&gt;</span></div>
        <div class="subj">${esc(m.subj)}</div><div class="txt">${esc(m.text)}</div>
        <div class="btns"><button data-m="${m.id}" data-v="safe" class="safe">✅ Безопасно</button>
        <button data-m="${m.id}" data-v="phish" class="phish">🎣 Фишинг</button></div>
        <div class="why" style="display:none"></div></div>`).join('')}</div>
      <div class="actions"><button class="big" id="chk">Проверить</button><button class="big" id="nx" style="display:none">Дальше →</button></div></div>`;
    main.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{
      if($('#chk').disabled) return;
      ans[b.dataset.m]=b.dataset.v;
      b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    });
    $('#chk').onclick=()=>{
      if(Object.keys(ans).length<E.MAIL.length){ toast('Отметь все сообщения'); return; }
      let ok=0; const mailOk={};
      E.MAIL.forEach(m=>{
        const r = (ans[m.id]==='phish')===m.phish; if(r) ok++; mailOk[m.id]=r;
        const el=$('#ml-'+m.id); el.classList.add(r?'right':'wrong');
        const w=el.querySelector('.why'); w.style.display='';
        w.innerHTML=`${r?'<span class="good">Верно!</span>':'<span class="badc">Ошибка.</span>'} Это <b>${m.phish?'фишинг':'безопасное сообщение'}</b>. ${m.why}`;
      });
      $('#chk').disabled=true; $('#chk').style.display='none'; $('#nx').style.display='';
      finishStep('mail', ok*2, { mailOk, mailScore:ok });
    };
    $('#nx').onclick=next;
  }

  /* ---------- 4. ЗАМОК НА ДВЕРИ (пароль) ---------- */
  function plural(n,f){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return f[2]; if(n1>1&&n1<5) return f[1]; if(n1===1) return f[0]; return f[2]; }
  function fmt(s){
    if(s<1) return 'мгновенно';
    if(s<60) return Math.round(s)+' сек';
    if(s<3600) return Math.round(s/60)+' мин';
    if(s<86400){ const h=Math.round(s/3600); return h+' '+plural(h,['час','часа','часов']); }
    if(s<31536000){ const d=Math.round(s/86400); return d+' '+plural(d,['день','дня','дней']); }
    const y=s/31536000;
    if(y<1000){ const r=Math.round(y); return r+' '+plural(r,['год','года','лет']); }
    if(y<1e6) return Math.round(y/1000)+' тыс. лет';
    if(y<1e9) return Math.round(y/1e6)+' млн лет';
    return 'больше миллиарда лет';
  }
  function analyze(pw){
    const types = [/[a-zа-яё]/.test(pw), /[A-ZА-ЯЁ]/.test(pw), /\d/.test(pw), /[^a-zA-Zа-яёА-ЯЁ0-9]/.test(pw)];
    let pool=0;
    if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26; if(/[а-яё]/.test(pw))pool+=33; if(/[А-ЯЁ]/.test(pw))pool+=33;
    if(/\d/.test(pw))pool+=10; if(types[3])pool+=33;
    const lp = Math.log2(pool||1);
    let bits = pw.length*lp;
    const low = pw.toLowerCase();
    let common=false, personal=false;
    ['1234','123','qwerty','password','parola','1111','0000','abc','йцукен','пароль','admin','love','iloveyou','2012','2013','2014'].forEach(c=>{
      if(low.includes(c)){ bits -= c.length*lp*0.9; common=true; } });
    S.name.toLowerCase().split(' ').forEach(p=>{ if(p.length>=3 && low.includes(p)){ bits -= p.length*lp*0.9; personal=true; } });
    if(/(.)\1\1/.test(pw)) bits -= 8;
    bits=Math.max(0,bits);
    const secs = Math.pow(2,bits)/2/1e10;   // 10 млрд попыток в секунду
    return { secs, len:pw.length, nTypes:types.filter(Boolean).length, types, common, personal };
  }
  function lock(){

      res=analyze(v);
      const y=res.secs/31536000;
      const pct = Math.max(4, Math.min(100, (Math.log10(res.secs+1)/Math.log10(31536000*1e6))*100));
      const col = y>=100 ? '#16a34a' : y>=1 ? '#84cc16' : res.secs>=86400 ? '#f59e0b' : '#dc2626';
      $('#mt').style.width=pct+'%'; $('#mt').style.background=col;

      pw.value=''; pw.disabled=true;
      finishStep('lock', p, { lockTime: fmt(res.secs), lockLen: res.len, lockTypes: res.nTypes });
      main.querySelector('.actions').innerHTML=`<span class="${p>=8?'good':'badc'}" style="margin-right:auto">Замок закреплён: взлом за ${fmt(res.secs)} · +${p} баллов</span><button class="big" id="nx">Дальше →</button>`;
      $('#nx').onclick=next;
    };
  }

        let acc=0,ph=phases[0],k=0; for(const p of phases){ if(s<acc+p.t){ph=p;k=(s-acc)/p.t;break;} acc+=p.t; }

      <div class="actions"><button class="big" id="chk">Проверить</button><button class="big" id="nx" style="display:none">Дальше →</button></div></div>`;
    $('#chk').onclick=()=>{
      const a=E.TEST.map((q,i)=>{ const r=main.querySelector(`input[name=q${i}]:checked`); return r?+r.value:null; });
      const miss=a.findIndex(x=>x===null);
      if(miss>=0){ toast(`Ответь на вопрос ${miss+1}`); $('#q'+miss).scrollIntoView({behavior:'smooth',block:'center'}); return; }
      let ok=0; const testOk=[];
      E.TEST.forEach((q,i)=>{
        const r=a[i]===q.c; if(r) ok++; testOk.push(r);
        const box=$('#q'+i), labels=box.querySelectorAll('label');
        labels[q.c].classList.add('c'); if(!r) labels[a[i]].classList.add('x');
        box.querySelectorAll('input').forEach(x=>x.disabled=true);
        const w=box.querySelector('.why'); w.style.display=''; w.innerHTML=(r?'<span class="good">Верно.</span> ':'<span class="badc">Неверно.</span> ')+esc(q.why);
      });
      $('#chk').style.display='none'; $('#nx').style.display='';
      finishStep('test', ok*3, { testOk, testScore:ok });
      toast(`Правильно ${ok} из 8`);
    };
    $('#nx').onclick=next;
  }

  /* ---------- 9. РЕФЛЕКСИЯ ---------- */
  function reflect(){
    let emo=null, moodText='';
    main.innerHTML = `<div class="card">
      <span class="mission-tag">Шаг 9 · 💬 Рефлексия</span>
      <h2>Как прошёл урок для тебя?</h2>
      <div class="emo">
        <button data-e="😀" data-m="Мне всё понятно, могу объяснить другу"><span>😀</span>Мне всё понятно, могу объяснить другу</button>
        <button data-e="🙂" data-m="Понятно, но есть вопросы"><span>🙂</span>Понятно, но есть вопросы</button>
        <button data-e="😕" data-m="Нужна помощь"><span>😕</span>Нужна помощь</button>
      </div>
      <h3>Закончи предложения</h3>
      <label>Сегодня я узнал(а), что…</label><textarea id="l1" rows="2"></textarea>
      <label style="display:block;margin-top:12px">Дома я изменю…</label><textarea id="l2" rows="2" placeholder="Например: подниму монитор, сменю пароль в игре…"></textarea>
      <div class="actions"><button class="big" id="ok">Получить Цифровой паспорт 🏅</button></div></div>`;
    main.querySelectorAll('.emo button').forEach(b=>b.onclick=()=>{ emo=b.dataset.e; moodText=b.dataset.m; main.querySelectorAll('.emo button').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#ok').onclick=()=>{
      const l1=$('#l1').value.trim(), l2=$('#l2').value.trim();
      if(!emo){ toast('Выбери смайлик'); return; }
      if(l1.length<5||l2.length<5){ toast('Закончи оба предложения'); return; }
      finishStep('reflect',6,{ emo, moodText, learned:l1, change:l2 }); next();
    };
  }

  /* ---------- 10. ЦИФРОВОЙ ПАСПОРТ ---------- */
  function passport(){
    const p=total(), m=E.mark(p);
    main.innerHTML = `<div class="passport">
      <h1>Цифровой паспорт безопасности</h1>
      <div class="nm">${esc(S.name)}</div><div>${esc(S.cls)} · ${today()} · TechLab</div>
      <div class="row" style="margin-top:18px;gap:40px">
        <div><div class="big">${p}%</div><div>защита комнаты</div></div>
        <div><div class="big">${m}</div><div>ориентировочная отметка</div></div>
        <div><div style="font-size:30px;font-weight:800">${E.rank(p)}</div><div>звание</div></div>
      </div>
      <div class="badges">${E.STEPS.filter(s=>s.max).map(s=>`<span class="bd">${s.icon} ${s.title}: <b>${S.pts[s.id]??0}/${s.max}</b></span>`).join('')}</div>
      <div class="rules2"><b>Мои правила цифровой безопасности:</b>
        <ol style="margin:6px 0 0"><li>Экран — на расстоянии вытянутой руки, верх — на уровне глаз.</li>
        <li>Каждые 20 минут — 20 секунд смотрю вдаль.</li>
        <li>Длинный пароль из слов, цифр и символов; никому его не говорю.</li>
        <li>Не перехожу по подозрительным ссылкам и не сообщаю коды из SMS.</li>
        <li>Не публикую адрес, телефон, школу и геометки.</li></ol></div>
    </div>
    <div class="card noprint" style="margin-top:18px">
      <p id="sendSt">⏳ Отправляю результат учителю…</p>
      <div class="actions" style="justify-content:flex-start"><button id="pr">🖨 Распечатать паспорт</button><button class="ghost" id="resend" style="display:none">Отправить ещё раз</button></div></div>`;
    $('#pr').onclick=()=>window.print();
    const send=()=>{ $('#sendSt').textContent='⏳ Отправляю результат учителю…'; $('#resend').style.display='none';
      submitFinal().then(()=>{ $('#sendSt').textContent='✅ Результат отправлен учителю. Отметку за урок выставляет учитель.'; })
        .catch(()=>{ $('#sendSt').textContent='⚠️ Нет связи. Проверь интернет и нажми «Отправить ещё раз» — или покажи этот экран учителю.'; $('#resend').style.display=''; }); };
    $('#resend').onclick=send; send();
  }

  $('#logout').onclick=()=>{ if(confirm('Выйти и начать заново под другим именем?')){ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); } };
  render();
})();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Учитель · Тренировочная сессия · География, 12 класс</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{
  --blue:#1f5f9e; --blue-d:#174a7c; --blue-l:#e8f0f8; --sky:#f3f7fb;
  --ink:#1d2733; --muted:#5d6b7a; --line:#c9d3de; --paper:#fff;
  --green:#2f7d3b; --warm:#d98b2b; --warm-l:#fdf3e4;
  --good:#2f7d3b; --good-l:#e9f4ea; --bad:#b3412f; --bad-l:#fbecea; --mid:#a86b12; --mid-l:#fdf3e1;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", "PT Sans", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--sky);line-height:1.45}
body::before{content:"";display:block;height:6px;background:var(--blue)}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}

/* --- кнопки --- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:.5rem .95rem;border-radius:8px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--blue);background:var(--blue-l)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.big{padding:.8rem 1.4rem;font-size:1.05rem}
.btn.small{padding:.3rem .7rem;font-size:.9rem}

/* --- старт --- */
.start{min-height:calc(100vh - 6px);display:grid;place-items:center;padding:2rem 1rem;
  background:linear-gradient(var(--blue) 0 210px, var(--sky) 210px)}
.start-card{background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(23,74,124,.14);max-width:560px;width:100%;padding:2rem 2rem 1.6rem}
.start-card.wide{max-width:820px}
.kicker{margin:0;color:var(--warm);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}
.start h1{margin:.3rem 0 .2rem;font-family:var(--serif);font-size:2.1rem;color:var(--blue-d)}
.sub{margin:0 0 1.2rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:0 0 1.4rem}
.facts div{background:var(--blue-l);border-radius:10px;padding:.6rem .4rem;text-align:center}
.facts b{display:block;font-size:1.5rem;color:var(--blue-d);font-family:var(--serif)}
.facts span{font-size:.82rem;color:var(--muted)}
form label{display:block;font-size:.9rem;font-weight:600;margin-bottom:.9rem;color:var(--muted)}
form input,form select{display:block;width:100%;margin-top:.3rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
form input[readonly]{background:#f3f6f9;color:var(--muted)}
form input:focus,form select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
form .btn{width:100%;margin-top:.3rem}
.notice{background:var(--warm-l);border:1px solid #f0d3a6;border-radius:10px;padding:.7rem .9rem;margin:0 0 1rem;font-size:.95rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rules{margin-top:1.2rem;border-top:1px solid #e6ecf2;padding-top:.9rem;font-size:.92rem;color:var(--muted)}
.rules summary{cursor:pointer;font-weight:600;color:var(--blue)}
.rules ul{padding-left:1.1rem}
table.scale{border-collapse:collapse;margin:.6rem 0;font-size:.9rem;min-width:220px}
table.scale th,table.scale td{border:1px solid var(--line);padding:.25rem .8rem;text-align:center}
table.scale th{background:var(--blue-l)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem;margin:1rem 0}
.tv{border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tv b{width:100%;font-family:var(--serif)}

/* --- верхняя панель --- */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;padding:.55rem 1.2rem;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.bar-l{display:flex;flex-direction:column;line-height:1.2}
.bar-l span{font-size:.85rem;color:var(--muted)}
.bar-c{text-align:center;font-size:.9rem;color:var(--muted);min-width:220px}
.bar-r{display:flex;gap:.6rem;justify-content:flex-end;align-items:center}
.pbar{height:5px;background:#e3e9f0;border-radius:3px;overflow:hidden;margin-top:.3rem}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;color:var(--blue-d);background:var(--blue-l);padding:.25rem .7rem;border-radius:8px}
.timer.warn{color:var(--bad);background:var(--bad-l)}

/* --- лист бланка --- */
.sheet{max-width:1000px;margin:1.4rem auto 3rem;background:var(--paper);box-shadow:0 2px 16px rgba(23,74,124,.1);border-radius:6px;padding:2.2rem 2.4rem;font-family:var(--serif)}
.blank-head{text-align:center;margin-bottom:1.2rem}
.blank-head p{margin:.1rem 0}
.h-title{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1.15rem}
.h-sub{font-weight:700}
.h-year{color:var(--muted);font-style:italic}
.h-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:.35rem 2rem;text-align:left;margin:1rem 0 .6rem;font-size:.98rem}
.fill{display:inline-block;min-width:140px;border-bottom:1px solid var(--ink);padding:0 .3rem;font-weight:700}
.h-var{font-weight:700;font-size:1.15rem;margin-top:.6rem!important}

table.blank{width:100%;border-collapse:collapse;font-size:1rem;table-layout:fixed}
table.blank th:first-child{width:2.6rem}table.blank th:last-child{width:6.4rem}
table.barem th:nth-child(2){width:4rem}table.barem th:last-child{width:30%}
table.blank th{background:var(--blue-l);border:1px solid #9fb2c6;padding:.4rem;font-family:var(--sans);font-size:.85rem;letter-spacing:.05em}
table.blank td{border:1px solid #9fb2c6;padding:.55rem .7rem;vertical-align:top}
table.blank tr.part td{border-top:none;border-bottom:none}
table.blank tr.part td.body{padding-top:.15rem}
table.blank tr.t-head td.stem{border-bottom:none}
table.blank tr.part+tr.t-head td,table.blank tr.part+tr.sec td,table.blank tr.part+tr.total td{border-top:1px solid #9fb2c6}
table.blank tr.part:last-of-type td{border-bottom:1px solid #9fb2c6}
td.num{width:2.6rem;text-align:center;font-weight:700}
td.pts{width:6.4rem;text-align:center;font-family:var(--sans);font-size:.85rem;color:var(--muted)}
td.pts b{color:var(--ink);font-size:1rem}
tr.sec td{background:#f4f8f3;color:var(--green);font-weight:700;font-family:var(--sans);font-size:.95rem;padding:.45rem .7rem}
tr.total td{font-weight:700;text-align:right}
td.stem{font-weight:600}
.q{margin:.35rem 0 .15rem}

/* поля как на бумаге */
.line{border:none;border-bottom:1px dashed #8aa0b6;background:transparent;font:inherit;font-family:var(--sans);color:var(--blue-d);padding:.25rem .2rem;outline:none;min-width:0}
.line:focus{border-bottom:2px solid var(--blue);background:var(--blue-l)}
.line.full{width:100%}
.two{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.2rem .5rem;align-items:end}
.dot{color:var(--muted)}
textarea.ruled{width:100%;border:1px solid #dbe3ec;border-radius:4px;resize:vertical;font:inherit;font-family:var(--sans);color:var(--blue-d);padding:0 .5rem;line-height:1.9rem;
  background:repeating-linear-gradient(#fff 0 calc(1.9rem - 1px), #cfd9e4 calc(1.9rem - 1px) 1.9rem);background-attachment:local;min-height:5.9rem}
textarea.ruled:focus{outline:none;border-color:var(--blue)}
.tf{display:grid;grid-template-columns:9.5rem auto 1fr;gap:.6rem;align-items:start;padding:.3rem 0}
.tf-fix .line{width:100%;margin-top:.2rem}
.vn{display:flex;gap:.3rem}
.pill{display:inline-grid;place-items:center;width:2rem;height:2rem;border:1.5px solid #8aa0b6;border-radius:50%;font-weight:700;font-family:var(--sans);cursor:pointer;user-select:none}
.pill input{display:none}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tf-s u{text-decoration-thickness:2px;text-underline-offset:3px}
table.grp{border-collapse:collapse;margin:.3rem 0;min-width:70%}
table.grp th,table.grp td{border:1px solid #c3cfdb;padding:.35rem .6rem;font-size:.95rem}
table.grp th{background:#f6f9fc;font-family:var(--sans);font-size:.85rem}
table.grp td.c{text-align:center;width:9rem}
.pick input{display:none}
.pick span{display:inline-block;width:1.25rem;height:1.25rem;border:1.5px solid #8aa0b6;border-radius:4px;vertical-align:middle;cursor:pointer}
.pick input:checked+span{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff}
figure.map{margin:.7rem 0 .2rem;text-align:center}
figure.map img{max-width:100%;border:1px solid #c3cfdb;border-radius:4px}
figure.map figcaption{font-size:.85rem;color:var(--muted);font-weight:400}

/* баллы L 0 1 2 */
.boxes{display:inline-flex;flex-wrap:wrap;gap:2px;margin-top:.35rem;justify-content:center;align-items:center;max-width:5.4rem}
.boxes .L{font-size:.7rem;color:#9aa8b6;margin-right:2px}
.boxes.wide .L{width:100%;margin:0}
.sb{display:inline-block;width:1.45rem;height:1.3rem;line-height:1.3rem;border:1px solid #b7c4d1;font-size:.78rem;color:#7d8b99;background:#fff}
.sb.on{background:var(--warm);border-color:var(--warm);color:#fff;font-weight:700}

/* проверка */
.rv{margin:.5rem 0 .3rem;padding:.55rem .75rem;border-radius:6px;font-family:var(--sans);font-size:.92rem;border-left:4px solid}
.rv.good{background:var(--good-l);border-color:var(--good);color:#205a29}
.rv.mid{background:var(--mid-l);border-color:var(--mid);color:#7a4c0a}
.rv.bad{background:var(--bad-l);border-color:var(--bad);color:#82301f}
.rv.self{background:#f5f8fb;border-color:var(--blue);color:var(--ink)}
.model{margin-top:.25rem;color:var(--ink)}
.model span{font-weight:700;color:var(--muted)}
.model i{color:var(--muted)}
.rate{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.rate button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.3rem .6rem;font-size:.86rem}
.rate button:hover{border-color:var(--blue)}
.rate button.on{background:var(--warm);border-color:var(--warm);color:#fff}
.mode-review input:disabled,.mode-review textarea:disabled{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.mode-review .pill,.mode-review .pick span{cursor:default}

.result{font-family:var(--sans);border:1px solid var(--line);border-radius:10px;padding:1.2rem;margin-bottom:1.8rem;background:linear-gradient(#f7fafd,#fff)}
.res-top{display:flex;gap:1.2rem;align-items:center}
.res-mark{flex:none;width:6.2rem;height:6.2rem;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.res-mark span{font-size:.75rem;opacity:.85;align-self:end}
.res-mark b{font-size:2.8rem;font-family:var(--serif);align-self:start}
.res-mark.wait{background:#9fb2c6}
.res-main h2{margin:0 0 .3rem;font-family:var(--serif);color:var(--blue-d)}
.res-main p{margin:.2rem 0;color:var(--muted)}
.meta{font-size:.88rem}
.warnc{color:var(--bad)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1rem 0 .8rem}
.rsec{background:#fff;border:1px solid #e1e8ef;border-radius:8px;padding:.6rem .7rem;font-size:.85rem;color:var(--muted)}
.rsec b{display:block;color:var(--ink);font-size:1.15rem;margin-top:.15rem}
.res-tasks{display:flex;flex-wrap:wrap;gap:.4rem}
.res-tasks a{text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:.25rem .55rem;font-size:.85rem;color:var(--ink);background:#fff}
.res-tasks a b{margin-left:.35rem}
.res-tasks a.full{border-color:#9cc8a3;background:var(--good-l)}
.res-tasks a.zero{border-color:#e3b0a7;background:var(--bad-l)}

.sign{margin-top:1.6rem;font-size:.95rem}
.end{text-align:center;margin-top:2rem}
table.barem td{font-size:.93rem}
table.barem td.crit{width:30%;color:var(--muted);font-family:var(--sans);font-size:.85rem}
.sc-h{font-family:var(--serif);margin-top:1.6rem}

.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,150%);opacity:0;visibility:hidden;background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-size:.92rem;transition:transform .3s;z-index:50;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:rgba(20,35,50,.45);display:grid;place-items:center;z-index:60;padding:1rem}
.mbox{background:#fff;border-radius:12px;padding:1.4rem 1.5rem;max-width:430px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 .5rem;font-family:var(--serif);color:var(--blue-d)}
.mbtns{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}

.mode-test .sheet{user-select:none}
.mode-test .sheet input,.mode-test .sheet textarea{user-select:text}

@media (max-width:760px){
  .boxes{max-width:2.6rem}
  .sheet{padding:1.2rem .8rem;margin:.6rem}
  .bar{grid-template-columns:1fr auto;padding:.5rem .7rem}
  .bar-c{display:none}
  .bar-r .btn{padding:.4rem .6rem;font-size:.85rem}
  .tf{grid-template-columns:1fr;gap:.3rem}
  .tf .vn{order:-1}
  .tf-fix{order:3}
  .h-grid{grid-template-columns:1fr}
  td.pts{width:3.2rem}
  table.blank th:first-child{width:2rem}table.blank th:last-child{width:3.4rem}
  table.blank td{padding:.45rem .45rem}
  table.blank th{font-size:.7rem;letter-spacing:0}
  .fill{min-width:90px}
  .facts b{font-size:1.2rem}
  .res-grid{grid-template-columns:1fr}
  .two{grid-template-columns:auto 1fr}
  table.grp{min-width:100%}
}
@media print{
  body{background:#fff}
  body::before,.bar,.end,.toast,.rate,.modal{display:none!important}
  .sheet{box-shadow:none;margin:0;max-width:none;padding:0}
  .result{break-inside:avoid}
  tr{break-inside:avoid}
  .line{border-bottom:1px solid #555}
  textarea.ruled{border:none;resize:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sb.on,.pill.on,.pick input:checked+span,.rv,.res-mark,tr.sec td,table.blank th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.pv{background:#fff4dc;color:#5a4300;text-align:center;font-size:.9rem;padding:.45rem;font-weight:600}
.rules-list{font-size:.88rem;color:var(--muted);padding-left:1.1rem;margin:.2rem 0 1rem}
.rules-list li{margin:.25rem 0}
.err{color:var(--bad);font-size:.92rem;min-height:1.2rem;margin:.2rem 0 .5rem;font-weight:600}
.saved{font-size:.8rem;color:var(--good)}
.tnote{margin-top:.35rem;font-size:.85rem;color:var(--blue-d)}
/* панель учителя */
.t-top{background:var(--blue);color:#fff;padding:.9rem 1.4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.t-top h1{margin:0;font-size:1.15rem;font-weight:700}
.t-top #who{font-size:.88rem;opacity:.9}.t-top #who a{color:#fff}
.t-main{max-width:1250px;margin:0 auto;padding:1.2rem}
.tcard{background:#fff;border:1px solid #dfe7ef;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.tcard.narrow{max-width:520px;margin:3rem auto;text-align:center}
.tcard h2{margin:.2rem 0 .4rem;font-family:var(--serif);color:var(--blue-d)}
.muted{color:var(--muted)}.small{font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.8rem 0 .3rem}
.switch{display:flex;align-items:center;gap:.6rem;font-weight:600;cursor:pointer;background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem}
.switch input{width:1.2rem;height:1.2rem}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.toolbar select,.toolbar input{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.stat{background:#fff;border:1px solid #dfe7ef;border-radius:10px;padding:.5rem .9rem;font-size:.82rem;color:var(--muted);min-width:110px}
.stat b{display:block;font-size:1.25rem;color:var(--ink)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #dfe7ef;border-radius:12px;margin-bottom:1rem}
table.res{width:100%;border-collapse:collapse;font-size:.9rem}
table.res th{background:var(--blue-l);text-align:left;padding:.55rem .6rem;font-size:.8rem;white-space:nowrap}
table.res td{border-top:1px solid #edf1f5;padding:.5rem .6rem;vertical-align:middle}
.nowrap{white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:.12rem .45rem;font-size:.8rem;font-weight:600}
.tag.run{background:var(--blue-l);color:var(--blue-d)}.tag.done{background:var(--good-l);color:var(--good)}.tag.warn{background:var(--mid-l);color:var(--mid)}
.grade{display:inline-grid;place-items:center;min-width:2rem;height:2rem;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:1.05rem}
.grade.pending{background:#9fb2c6;padding:0 .3rem}
.btn.red{color:var(--bad)}.btn.red:hover{background:var(--bad-l);border-color:var(--bad)}
.backlink{display:inline-block;margin:0 0 .8rem;text-decoration:none;font-weight:600}
.chk{position:fixed;inset:0;z-index:40;background:var(--sky);overflow:auto}
.chk-bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:.6rem 1.2rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.92rem}
.chk-bar .sp{flex:1}
body.noscroll{overflow:hidden}
.rv.tch .rate button{min-width:2.1rem}
.rv .src{font-size:.8rem;color:var(--muted);margin-left:.3rem}
.pbar-top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto}
@media print{.t-top,.backlink,.chk-bar,.pbar-top,.pv{display:none!important}.chk{position:static;overflow:visible}.t-main{padding:0}}
</style>
</head>
<body class="mode-teacher">
<header class="t-top"><h1>🌍 Тренировочная сессия · География, 12 класс · панель учителя</h1><div id="who"></div></header>

   op('2) Установите причину того, что среда, отмеченная буквой G, — самая холодная на Земле:', 'Высокие широты: малый угол падения солнечных лучей и полярная ночь; огромная высота ледяного щита (в среднем более 2000 м) — с высотой температура понижается; лёд и снег отражают до 90 % солнечной радиации.'),
   op('3) Выявите одну меру по охране природы среды, отмеченной буквой B:', 'Создание национальных парков (Серенгети, Крюгер); борьба с браконьерством (охота на слонов и носорогов); регулирование выпаса скота для предотвращения опустынивания; развитие экотуризма.'),
 ]},
],
];

const SCALE = [[57,10],[51,9],[45,8],[39,7],[30,6],[18,5],[12,4],[6,3],[3,2],[0,1]];
const SECTIONS = {1:'I. Познавательная область «Знание и понимание»', 2:'II. Познавательная область «Применение»', 3:'III. Познавательная область «Интеграция (синтез) и перенос»'};

/* ===== ОБЩЕЕ: бланк, проверка, схема оценивания (ученик и учитель) ===== */
const WORK = { id: 'geo12-sess', title: 'Тренировочная сессия по географии · 12 класс', minutes: 90, max: 60 };
const DURATION = WORK.minutes * 60 * 1000;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => String(h ?? '').replace(/<[^>]+>/g, '');
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/₂/g, '2')
  .replace(/[-–—]/g, ' ').replace(/[«»"'.,;:!?()\[\]\/\\]/g, ' ').replace(/\s+/g, ' ').trim();
const has = (a, x) => norm(x).split(' ').every(w => a.includes(w));
const hit = (ans, stems, not = []) => {
  if (!norm(ans)) return false;
  const a = ' ' + norm(ans) + ' ';
  if (not.some(x => has(a, x))) return false;
  return stems.some(x => has(a, x));
};
const groupOf = (ans, groups) => groups.findIndex(g => hit(ans, g));
const markFor = pts => SCALE.find(([min]) => pts >= min)[1];
const maxOf = p => p.t === 'sh' ? 1 : p.t === 'grp' ? p.items.length : 2;
const key = (n, i) => `t${n}p${i}`;
const fmtDate = ms => new Date(ms || Date.now()).toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });

function scaleTable() {
  const rows = SCALE.map(([min, g], i) => `<tr><td>«${g}»</td><td>${min}–${i === 0 ? 60 : SCALE[i - 1][0] - 1}</td></tr>`).join('');
  return `<table class="scale"><thead><tr><th>Отметка</th><th>Баллы</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- проверка одной работы ----------
   A — ответы, SELF — самооценка ученика (развёрнутые ответы), MAN — баллы учителя (перекрывают всё) */
function answerText(p, k, A) {
  if (p.t === 'tf') return A[k + 'v'] ? A[k + 'v'] + (A[k + 'v'] === 'Н' && A[k + 'f'] ? ' → ' + A[k + 'f'] : '') : '';
  if (p.t === 'two') return [A[k + 'a'], A[k + 'b']].filter(x => norm(x)).join('; ');
  if (p.t === 'grp') return p.items.map(([n], j) => A[k + 'g' + j] !== undefined ? `${n} — ${p.cats[+A[k + 'g' + j]]}` : '').filter(Boolean).join('; ');
  return A[k] || '';
}
function modelText(p) {
  if (p.t === 'tf') return p.a === 'В' ? 'Верно' : `Неверно; правильно: ${p.show}`;
  if (p.t === 'grp') return p.cats.map((c, ci) => `${c}: ${p.items.filter(x => x[1] === ci).map(x => x[0]).join(', ')}`).join(' · ');
  if (p.t === 'op') return p.m;
  return p.show;
}
function autoOf(p, k, A) {
  if (p.t === 'tf') { const v = A[k + 'v']; if (!v || v !== p.a) return 0; return p.a === 'В' ? 2 : (hit(A[k + 'f'], p.fix, p.not) ? 2 : 1); }
  if (p.t === 'two') { const g1 = groupOf(A[k + 'a'], p.g), g2 = groupOf(A[k + 'b'], p.g); return (g1 >= 0 ? 1 : 0) + (g2 >= 0 && g2 !== g1 ? 1 : 0); }
  if (p.t === 'sh') return hit(A[k], p.acc, p.not) ? 1 : 0;
  if (p.t === 'grp') return p.items.reduce((s, [, c], j) => s + (A[k + 'g' + j] !== undefined && +A[k + 'g' + j] === c ? 1 : 0), 0);
  return null;   // op — развёрнутый ответ
}
function evaluate(v, A = {}, SELF = {}, MAN = {}) {
  const V = VARIANTS[v]; const items = []; let sec = 1;
  const secs = { 1: [0, 0], 2: [0, 0], 3: [0, 0] }; const tasks = [];
  V.forEach(t => {
    if (t.sec) sec = t.sec; let ts = 0;
    t.parts.forEach((p, i) => {
      const k = key(t.n, i), max = maxOf(p), empty = !norm(answerText(p, k, A));
      let auto = autoOf(p, k, A);
      if (p.t === 'op' && empty) auto = 0;
      const self = p.t === 'op' && Number.isFinite(SELF[k]) ? SELF[k] : null;
      const man = Number.isFinite(MAN[k]) ? MAN[k] : null;
      const score = man ?? (p.t === 'op' ? (empty ? 0 : self) : auto);
      items.push({ k, n: t.n, i, sec, p, max, auto, self, man, score, empty });
      if (score !== null) { ts += score; secs[sec][0] += score; }
      secs[sec][1] += max;
    });
    tasks.push({ n: t.n, sum: ts, max: t.p });
  });
  const total = items.reduce((s, x) => s + (x.score ?? 0), 0);
  const pending = items.filter(x => x.score === null).length;
  return { items, total, pending, complete: !pending, grade: markFor(total), secs, tasks };
}
const cut = (x, n = 400) => { const s = String(x ?? '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function resultOf(v, A, SELF, MAN) {
  const e = evaluate(v, A, SELF, MAN);
  return { total: e.total, max: 60, grade: e.grade, complete: e.complete, pct: Math.round(e.total / 60 * 100),
    items: e.items.map(x => ({ l: cut(`${x.n}. ${strip(x.p.q || x.p.s || 'Группировка')}`, 300), s: x.score, m: x.max,
      a: cut(answerText(x.p, x.k, A) || '—'), k: cut(strip(modelText(x.p))), c: '' })) };
}

}
function partHTML(t, p, i, mode, A) {
  const k = key(t.n, i), ro = mode !== 'test' ? 'disabled' : '';
  if (p.t === 'tf') {
    const v = A[k + 'v'] || '';

      <span class="tf-s">${i + 1}) ${p.s}</span></div>`;
  }

      <span class="dot">•</span><input class="line" data-a="${k}b" value="${esc(A[k + 'b'])}" ${ro}></div>`;
  if (p.t === 'sh') return `<p class="q">${p.q}</p><input class="line full" data-a="${k}" value="${esc(A[k])}" ${ro}>`;
  if (p.t === 'op') return `<p class="q">${p.q}</p><textarea class="ruled" rows="4" data-a="${k}" ${ro}>${esc(A[k])}</textarea>`;
  return `<table class="grp"><thead><tr><th>Объект</th>${p.cats.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>
      ${p.items.map(([name], j) => `<tr><td>${name}</td>${p.cats.map((_, c) => `<td class="c"><label class="pick"><input type="radio" name="${k}g${j}" value="${c}" data-a="${k}g${j}" ${A[k + 'g' + j] !== undefined && +A[k + 'g' + j] === c ? 'checked' : ''} ${ro}><span></span></label></td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
}
/* extra(t, p, i) — дополнительный блок под пунктом (проверка ученика / панель учителя) */
function blankHTML(v, mode, A = {}, extra = null) {
  const V = VARIANTS[v];

}

/* ---------- схема оценивания ---------- */
function crit(p) {
  if (p.t === 'tf') return 'По 2 б. за каждый правильный ответ; по 1 б., если правильно отмечена буква Н, но не написаны слова, делающие утверждение верным.';
  if (p.t === 'two') return 'По 1 б. за каждый правильный ответ; всего – 2 б.';
  if (p.t === 'sh') return '1 б. за правильный ответ.';
  if (p.t === 'grp') return `По 1 б. за каждый правильно отнесённый объект; всего – ${p.items.length} б.`;
  return '1 б. за частично правильный и 2 б. за правильный и полный ответ.';
}
function baremPage(v) {
  const rows = VARIANTS[v].map(t => t.parts.map((p, i) => {
    const ans = p.t === 'tf' ? (p.a === 'В' ? 'Верно' : `Неверно; правильный ответ: <b>${p.show}</b>`)
      : p.t === 'grp' ? p.cats.map((c, ci) => `<b>${c}:</b> ${p.items.filter(x => x[1] === ci).map(x => x[0]).join(', ')}`).join('<br>')
      : p.t === 'op' ? p.m + ' <i>Примечание: допускаются и другие правильные ответы.</i>' : p.show;
    const label = p.t === 'tf' ? `${i + 1})` : p.t === 'grp' ? '' : (p.q.match(/^\d\)\s?[а-г]?\)?/) || [''])[0];
    const allTf = t.parts.every(x => x.t === 'tf');
    const cc = allTf ? (i === 0 ? `<td class="crit" rowspan="${t.parts.length}">${crit(p)} Всего – ${t.p} б.</td>` : '') : `<td class="crit">${crit(p)}</td>`;
    return `<tr>${i === 0 ? `<td class="num" rowspan="${t.parts.length}">${t.n}</td><td class="pts" rowspan="${t.parts.length}">${t.p}</td>` : ''}<td>${label ? `<b>${label}</b> ` : ''}${ans}</td>${cc}</tr>`;
  }).join('')).join('');
  return `<header class="blank-head"><p class="h-title">Схема оценивания теста</p><p class="h-sub">12 класс (зимняя сессия, тренировочный вариант), 2026–2027 учебный год</p><p class="h-var">Вариант № ${v + 1}</p></header>

    <h3 class="sc-h">Шкала оценивания</h3>${scaleTable()}<p class="sign">Преподаватель: Туманов Д.А.</p>`;
}

  }));
  // оценки сразу попадают ученикам и родителям (как в Центре управления)
  if (!stopSync) import('./engine/sync.js?v=3').then(m => { stopSync = m.startAutoSync(db); unsub.push(() => { stopSync && stopSync(); stopSync = null; }); }).catch(e => console.warn(e));
}

/* итог в базе — его видят Центр управления, прогресс ученика и сам ученик */
const lastSig = {};
function syncResults() {
  for (const [id, r] of Object.entries(RESULTS)) {
    if (r.status !== 'submitted') continue;
    const res = resultOf((r.variant || 1) - 1, r.answers || {}, r.self || {}, r.manual || {});
    const sig = JSON.stringify([res.total, res.grade, res.complete, res.items.map(x => x.s)]);
    if (lastSig[id] === sig || r.result?.sig === sig) { lastSig[id] = sig; continue; }
    lastSig[id] = sig; res.sig = sig;
    D.update(D.ref(db, `${P}/${id}`), { result: res }).catch(() => {});
  }
}
function rows() {
  return Object.entries(RESULTS).filter(([, r]) => (!filterCls || r.cls === filterCls) && (!search || String(r.name).toLowerCase().includes(search)))
    .sort((a, b) => (b[1].startedAt || 0) - (a[1].startedAt || 0));
}
function statusTag(r) {
  if (r.status === 'in_progress') return Date.now() > (r.deadline || 0) + 60000 ? '<span class="tag warn">не сдал (время вышло)</span>' : '<span class="tag run">⏳ пишет</span>';
  return r.reason === 'timeout' ? '<span class="tag warn">⏰ время вышло</span>' : '<span class="tag done">✅ сдано</span>';
}
function renderTable() {
  const classes = [...new Set(Object.values(RESULTS).map(r => r.cls).filter(Boolean))].sort();
  const sel = $('#fCls'); if (sel) sel.innerHTML = '<option value="">Все классы</option>' + classes.map(c => `<option ${c === filterCls ? 'selected' : ''}>${esc(c)}</option>`).join('');
  const all = Object.values(RESULTS), sub = all.filter(r => r.status === 'submitted'), ev = sub.map(evalR), full = ev.filter(e => e.complete);
  const f1 = n => String(Math.round(n * 10) / 10).replace('.', ',');
  $('#stats').innerHTML = [['Всего', all.length], ['Пишут', all.filter(r => r.status === 'in_progress').length], ['Сдали', sub.length],
    ['Средняя отметка', full.length ? f1(full.reduce((s, e) => s + e.grade, 0) / full.length) : '—'],
    ['Средний балл', ev.length ? f1(ev.reduce((s, e) => s + e.total, 0) / ev.length) + ' / 60' : '—']].map(([l, n]) => `<div class="stat"><b>${n}</b>${l}</div>`).join('');
  const list = rows(), tb = $('#tb');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="13" class="muted">Работ пока нет. Включите «Работа открыта», и ученики смогут начать.</td></tr>'; return; }
  tb.innerHTML = list.map(([id, r], i) => {
    const fin = r.status === 'submitted', e = evalR(r);
    return `<tr><td>${list.length - i}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.cls)}</td><td>${r.variant}</td><td>${statusTag(r)}</td>
      <td>${r.violations ? `<span class="tag warn">${r.violations}</span>` : '0'}</td><td>${fmtWhen(r.startedAt, r.submittedAt)}</td>
      ${[1, 2, 3].map(s => `<td>${fin ? `${e.secs[s][0]}/${e.secs[s][1]}` : '—'}</td>`).join('')}
      <td>${fin ? `<b>${e.total}</b> / 60` : '—'}</td>
      <td>${fin ? (e.complete ? `<span class="grade">${e.grade}</span>` : `<span class="grade pending">≈${e.grade}</span><br><small>не оценено: ${e.pending}</small>`) : '—'}</td>
      <td class="nowrap"><button class="btn small" data-open="${id}">${fin ? 'Открыть' : 'Смотреть'}</button>
        ${!fin ? `<button class="btn small" data-stop="${id}" title="Завершить работу ученика">Завершить</button>` : ''}
        <button class="btn small red" data-del="${id}" title="Удалить работу">✕</button></td></tr>`;
  }).join('');
  tb.querySelectorAll('[data-open]').forEach(b => b.onclick = () => showCheck(b.dataset.open));
  tb.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => { if (confirm('Завершить работу этого ученика? Она будет сдана с текущими ответами.'))
    D.update(D.ref(db, `${P}/${b.dataset.stop}`), { status: 'submitted', reason: 'teacher', submittedAt: Date.now() }); });
  tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const r = RESULTS[b.dataset.del];
    if (confirm(`Удалить работу «${r?.name}»? Это нельзя отменить.`)) D.remove(D.ref(db, `${P}/${b.dataset.del}`)); });
}

/* ---------- одна работа: ответы, эталон, баллы ---------- */
function showCheck(id, refresh = false) {
  const r = RESULTS[id]; if (!r) { closeCheck(); return; }
  openId = id;
  const v = (r.variant || 1) - 1, A = r.answers || {}, SELF = r.self || {}, MAN = r.manual || {}, e = evaluate(v, A, SELF, MAN);
  const box = (t, p, i) => {
    const x = e.items.find(y => y.n === t.n && y.i === i);
    const src = x.man !== null ? '✍ учитель' : p.t === 'op' ? (x.empty ? 'нет ответа' : x.self !== null ? 'самооценка ученика' : 'ученик ещё не оценил') : 'автопроверка';
    const btns = Array.from({ length: x.max + 1 }, (_, k) => `<button data-mk="${x.k}" data-v="${k}" class="${x.score === k ? 'on' : ''}">${k}</button>`).join('');
    return `<div class="rv tch ${x.score === x.max ? 'good' : x.score ? 'mid' : x.score === 0 ? 'bad' : 'self'}">
      <div class="model"><span>${p.t === 'op' ? 'Эталон' : 'Правильный ответ'}:</span> ${p.t === 'op' ? p.m : modelText(p)}</div>
      <div class="rate">Балл: ${btns} <span class="src">${src}</span>${x.man !== null ? ` <button data-reset="${x.k}" title="Вернуть автоматический балл / самооценку">↺ сбросить</button>` : ''}</div></div>`;
  };
  const html = `<div class="chk-bar"><b>${esc(r.name)}</b>, ${esc(r.cls)} · вариант № ${r.variant} · ${r.status === 'submitted' ? `<b>${e.total} / 60</b> · отметка ${e.complete ? `«${e.grade}»` : `≈${e.grade} (не оценено: ${e.pending})`}` : 'ещё пишет'}
      · выходов из окна: ${r.violations || 0}
      <span class="sp"></span><button class="btn small" id="cPrint">Печать / PDF</button><button class="btn small primary" id="cClose">Закрыть</button></div>
    <main class="sheet">${headerBlock({ name: r.name, cls: r.cls, date: fmtDate(r.startedAt), v, score: r.status === 'submitted' ? e.total : '', mark: r.status === 'submitted' && e.complete ? e.grade : '' })}
      ${blankHTML(v, 'review', A, box)}</main>`;
  let ov = $('#chk');
  const st = ov ? ov.scrollTop : 0;
  if (!ov) { ov = document.createElement('div'); ov.id = 'chk'; ov.className = 'chk'; document.body.appendChild(ov); document.body.classList.add('noscroll'); }
  ov.innerHTML = html; paintBoxes(e, ov);
  if (refresh) ov.scrollTop = st;
  $('#cClose').onclick = closeCheck;
  $('#cPrint').onclick = () => window.print();
  ov.onclick = async ev => {
    const b = ev.target.closest('[data-mk]'), rs = ev.target.closest('[data-reset]');
    if (b) await D.update(D.ref(db, `${P}/${id}/manual`), { [b.dataset.mk]: +b.dataset.v });
    if (rs) await D.remove(D.ref(db, `${P}/${id}/manual/${rs.dataset.reset}`));
  };
}
function closeCheck() { openId = null; $('#chk')?.remove(); document.body.classList.remove('noscroll'); }

function exportCsv() {
  const head = ['Ученик', 'Класс', 'Вариант', 'Статус', 'Выходы', 'Начало', 'I', 'II', 'III', 'Итог', 'Отметка'];
  const lines = rows().map(([, r]) => { const e = evalR(r), fin = r.status === 'submitted';
    return [r.name, r.cls, r.variant, fin ? 'сдано' : 'пишет', r.violations || 0, r.startedAt ? new Date(r.startedAt).toLocaleString('ru-RU') : '',
      ...[1, 2, 3].map(s => fin ? e.secs[s][0] : ''), fin ? e.total : '', fin && e.complete ? e.grade : ''].map(x => `"${String(x).replace(/"/g, '""')}"`).join(';'); });
  const blob = new Blob(['﻿' + [head.join(';'), ...lines].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'geo12-sessiya.csv'; a.click();
}

/* ---------- бланки и схемы ---------- */
function showPaper() {
  closeCheck();
  $('#app').innerHTML = `<a class="backlink" href="#" id="pBack">← Назад</a>
  <div class="tcard"><p class="kicker">Для печати</p><h2>Бланки и схемы оценивания</h2>
    <p class="muted">Пустой бланк любого варианта для письменной работы и схема оценивания с эталонами ответов.</p>
    <div class="tgrid">${VARIANTS.map((_, i) => `<div class="tv"><b>Вариант № ${i + 1}</b><button class="btn small" data-blank="${i}">Бланк</button><button class="btn small" data-barem="${i}">Схема оценивания</button></div>`).join('')}</div>
    <b>Шкала оценивания</b>${scaleTable()}</div>`;
  $('#pBack').onclick = e => { e.preventDefault(); auth.currentUser ? showDashboard() : showLogin(); };
  $('#app').querySelectorAll('[data-blank],[data-barem]').forEach(b => b.onclick = () => {
    const isB = b.dataset.barem !== undefined, v = +(b.dataset.blank ?? b.dataset.barem);
    $('#app').innerHTML = `<div class="pbar-top"><a class="backlink" href="#" id="p2">← К списку вариантов</a><button class="btn primary" onclick="window.print()">Печать / PDF</button></div>
      <main class="sheet">${isB ? baremPage(v) : headerBlock({ v }) + blankHTML(v, 'paper', {})}</main>`;
    $('#p2').onclick = e => { e.preventDefault(); showPaper(); };
  });
}

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Суммативное оценивание · География · 11 класс · Население и населённые пункты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f5fa8;--blue-d:#174a85;--blue-l:#e7eff9;--ink:#1d232b;--muted:#6b7480;--line:#b9c3cf;--line-l:#dde3ea;--green:#2e7d32;--green-l:#edf6ee;--red:#c62828;--red-l:#fdecec;--amber:#a86400;--amber-l:#fff4e0;--paper:#fff;--bg:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"PT Sans",Arial,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.serif{font-family:"PT Serif",Georgia,"Times New Roman",serif}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line-l);display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:12px}
.bar .who b{display:block;font-size:15px}
.bar .who span{font-size:12.5px;color:var(--muted)}
.bar .right{display:flex;align-items:center;gap:10px}
.timer{background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:21px;padding:5px 12px;border-radius:7px;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.warn{background:var(--red-l);color:var(--red)}
.btn{font-family:inherit;font-size:15px;font-weight:700;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f6f9}
.progress{font-size:12.5px;color:var(--muted)}

/* ---------- лист ---------- */
.paper{max-width:1000px;margin:22px auto 60px;background:var(--paper);box-shadow:0 1px 3px rgba(20,30,50,.08),0 6px 24px rgba(20,30,50,.06);border-radius:6px;padding:38px 38px 44px}
.h1{text-align:center;font-weight:700;font-size:19px;letter-spacing:1.5px;margin:0}
.h2{text-align:center;font-weight:700;font-size:15.5px;margin:6px 0 2px}
.h3{text-align:center;font-style:italic;color:var(--muted);font-size:14px;margin:0}
.fields{display:grid;grid-template-columns:1fr 280px;gap:9px 30px;margin:24px 0 14px;font-size:15px}
.fields .f{display:flex;align-items:flex-end;gap:6px}
.fields .v{min-width:150px;border-bottom:1px solid var(--ink);font-weight:700;padding:0 6px 1px}
.variant{text-align:center;font-weight:700;font-size:17px;margin:8px 0 16px}

table.main{width:100%;border-collapse:collapse;font-size:15px;line-height:1.5}
table.main>thead>tr>th{font-family:"PT Sans",Arial,sans-serif;background:var(--blue-l);color:#23466e;font-size:13px;letter-spacing:.6px;padding:9px 6px;border:1px solid var(--line)}
table.main>tbody>tr>td{border:1px solid var(--line);vertical-align:top;padding:12px 12px}
td.no{width:44px;text-align:center;font-weight:700;padding-top:13px!important}
td.pts{width:104px;text-align:center}
tr.sec>td{background:var(--green-l);color:var(--green);font-family:"PT Sans",Arial,sans-serif;font-weight:700;font-size:14px;padding:8px 12px!important}
.q{font-weight:700;margin:0 0 10px}
.pts b{font-size:16px}
.lbox{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:10px;font-family:"PT Sans",Arial,sans-serif;font-size:11px;color:var(--muted);align-items:center}
.lbox span{display:inline-block;min-width:19px;border:1px solid var(--line);color:var(--blue);padding:1px 3px;line-height:16px}
.lbox span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lbox.pending span{opacity:.45}
.ptsnote{font-family:"PT Sans",Arial,sans-serif;font-size:11.5px;margin-top:8px;line-height:1.3}
.ptsnote.ai{color:var(--amber)}

/* поля ввода */
.inl{font-family:"PT Sans",Arial,sans-serif;font-size:14.5px;border:0;border-bottom:1px dotted #8a96a3;background:transparent;padding:3px 4px;outline:none;color:var(--ink)}
.inl:focus{border-bottom:1px solid var(--blue);background:#f6f9fd}
select.sel{font-family:"PT Sans",Arial,sans-serif;font-size:14px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;color:var(--ink);max-width:100%}
select.sel:focus{outline:2px solid #b9d0ee}
textarea.ta{width:100%;min-height:118px;resize:vertical;font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:1.55;border:1px solid var(--line);border-radius:5px;padding:9px 11px;background:repeating-linear-gradient(#fff,#fff 27px,#eef1f5 28px);outline:none}
textarea.ta:focus{border-color:var(--blue)}
.small{font-family:"PT Sans",Arial,sans-serif;font-size:12.5px;color:var(--muted)}

/* 1. верно/неверно */
.tf{display:grid;grid-template-columns:160px 84px 1fr;gap:10px;align-items:start;padding:8px 0}
.tf+.tf{border-top:1px dashed var(--line-l)}
.tf .inl{width:100%;margin-top:4px}
.vn{display:flex;gap:6px}
.vn label{cursor:pointer}
.vn input{display:none}
.vn span{display:inline-flex;width:32px;height:32px;border-radius:50%;border:1.5px solid #7d8894;align-items:center;justify-content:center;font-family:"PT Sans",Arial,sans-serif;font-weight:700;font-size:14px;background:#fff}
.vn input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.tf u{text-decoration:none;border-bottom:1.5px solid var(--ink)}
.tf .inl:disabled{opacity:.35}

/* 2. выбор */
.mcq{margin:4px 0 14px}
.mcq:last-child{margin-bottom:0}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line-l);border-radius:7px;padding:8px 12px;margin:6px 0;cursor:pointer;font-family:"PT Sans",Arial,sans-serif;font-size:14.5px}
.opt:hover{background:#f7f9fc}
.opt input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.opt.sel{border-color:var(--blue);background:#f1f6fd}

/* 3. соотнесение */
.match{display:grid;grid-template-columns:270px 1fr;gap:18px}
.mt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line-l)}
.mt select{width:62px}
.defs div{padding:4px 0 4px 26px;text-indent:-26px;font-size:14.5px}
.defs b{display:inline-block;width:26px;text-indent:0}

/* таблицы данных */
table.data{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 4px}
table.data th,table.data td{border:1px solid var(--line);padding:6px 6px;text-align:center}
table.data th{font-family:"PT Sans",Arial,sans-serif;font-size:12.5px;background:#f3f5f8;font-weight:700;line-height:1.25}
table.data td.l{text-align:left}
table.data .inl{width:100%;text-align:center}
table.data td.ans{background:#fbfcfe}

/* 5. пропуски */
.gaps{line-height:2.3}
.gaps select{margin:0 3px}

/* 7. пирамида */
.pyr{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.pyr svg{width:100%;height:auto;border:1px solid var(--line-l);border-radius:6px;background:#fcfdfe}
.qrow{margin:2px 0 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-family:"PT Sans",Arial,sans-serif;font-size:14.5px;padding:4px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px}

/* 8. порядок */
.order{display:flex;flex-direction:column;gap:7px}
.order .row{display:flex;align-items:center;gap:10px}
.order .n{width:26px;height:26px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-family:"PT Sans",Arial,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.order select{flex:1;max-width:520px}

/* 9. цепочка */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px}
.lk{border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:7px 10px;font-family:"PT Sans",Arial,sans-serif;font-size:13.5px;max-width:200px;line-height:1.3}
.chain select{max-width:220px;font-size:13px;white-space:normal}
.arr{color:#8a96a3;font-size:18px}
.chain-title{font-family:"PT Sans",Arial,sans-serif;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

/* ситуации */
.case{border-left:3px solid var(--blue);background:#f6f9fd;padding:10px 14px;margin:0 0 10px;font-style:italic}
.ai-c{font-family:"PT Sans",Arial,sans-serif;font-size:13px;margin-top:8px;padding:8px 11px;border-radius:6px;background:var(--amber-l);color:#6d4300}
.ai-c.ok{background:var(--green-l);color:#1e5a22}

/* стартовый экран */
.start{max-width:640px}
.start label{display:block;font-family:"PT Sans",Arial,sans-serif;font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.start input,.start select{width:100%;font-family:"PT Sans",Arial,sans-serif;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
.rules{font-family:"PT Sans",Arial,sans-serif;font-size:14px;background:#f6f8fb;border:1px solid var(--line-l);border-radius:7px;padding:12px 16px 12px 34px;margin:20px 0;line-height:1.6}
.err{color:var(--red);font-family:"PT Sans",Arial,sans-serif;font-size:13px;margin-top:8px;min-height:18px}

/* оверлеи */
.ov{position:fixed;inset:0;background:rgba(16,24,38,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:10px;padding:26px 28px;max-width:440px;width:100%;font-family:"PT Sans",Arial,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 14px;color:#444;line-height:1.5}
.card input{width:100%;font-size:18px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;letter-spacing:3px;text-align:center}
.card .btns{display:flex;gap:10px;justify-content:flex-end}
.lockicon{width:46px;height:46px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px}

.result{border:1.5px solid var(--blue);border-radius:8px;background:#f5f9fe;padding:14px 18px;margin:0 0 20px;font-family:"PT Sans",Arial,sans-serif}
.result .big{font-size:22px;font-weight:700;color:var(--blue-d)}
.done input,.done select,.done textarea{pointer-events:none}
.hidden{display:none!important}
@media (max-width:760px){.paper{padding:20px 14px}.fields{grid-template-columns:1fr}.tf{grid-template-columns:1fr}.match,.pyr{grid-template-columns:1fr}td.pts{width:70px}}
@media print{.bar,.ov{display:none!important}body{background:#fff}.paper{box-shadow:none;margin:0;max-width:none}}
</style>
</head>
<body>
<div class="bar hidden" id="bar">
  <div class="who"><b id="barV">Вариант № –</b><span id="barWho"></span></div>
  <div class="right">
    <span class="progress" id="prog"></span>
    <div class="timer" id="timer">45:00</div>
    <button class="btn" id="btnSubmit">Сдать работу</button>
  </div>
</div>

<div class="paper serif" id="paper"></div>

<div class="ov hidden" id="ovLock"><div class="card">
  <div class="lockicon">&#9888;</div>
  <h3>Вы вышли из теста</h3>
  <p id="lockReason">Вы вышли из полноэкранного режима.</p>
  <p style="font-size:14px">Это нарушение записано и будет видно учителю. Таймер продолжает идти.</p>
  <div class="btns"><button class="btn" id="btnUnlock">Вернуться к тесту</button></div>
</div></div>

<div class="ov hidden" id="ovSubmit"><div class="card">
  <h3>Сдать работу?</h3>
  <p id="submitInfo"></p>
  <div class="btns"><button class="btn ghost" id="btnCancel">Вернуться к тесту</button><button class="btn" id="btnConfirm">Сдать</button></div>
</div></div>


<script>

</script>
<script>
/* ===================== НАСТРОЙКИ (меняйте здесь) ===================== */
var CONFIG = {
  /* адрес сервера (веб-приложение Apps Script «TechLab — результаты») */
  serverUrl: "https://script.google.com/macros/s/AKfycbxuWCBIw9_SiAVP0BLwURgMyoQ7hvqMHEu9aSPeoCtcUW_jsw77j8aFrtqi6TsIaLirTw/exec",
  testId: "geo11_unit3_population",
  title: "Единица обучения III: «Население и населённые пункты»",
  minutes: 45,
  variants: 30,
  /* "auto" – вариант выдаётся автоматически по имени/коду ученика; "choose" – ученик выбирает номер, который назвал учитель.
     Ссылка вида ...?v=12 всегда открывает вариант 12. */
  variantMode: "choose",
  classes: ["11 «А»", "11 «Б»", "11 «В»", "11 «Г»"],
  lockMode: true,                /* предупреждать и записывать нарушение при выходе из полноэкранного режима / смене вкладки */
  requireCode: false,            /* true – без кода ученика тест не начнётся */
  showResultToStudent: true      /* показать ученику баллы и отметку после проверки */
};

/* ===================== СОСТОЯНИЕ ===================== */
var $ = function (id) { return document.getElementById(id); };
var params = new URLSearchParams(location.search);
var S = null, T = null, A = null, tick = null, submitting = false;
var SEC = { 1: "I. Знание и понимание", 2: "II. Применение", 3: "III. Интеграция" };
var LET = ["а", "б", "в", "г", "д", "е"];

function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function key(name, cls, code) { return "tl_" + CONFIG.testId + "_" + hash(norm(name) + "|" + cls + "|" + norm(code)); }
function store(st) { try { localStorage.setItem(st.key, JSON.stringify(st)); } catch (e) { } }
function save() { if (!S) return; S.answers = A; try { localStorage.setItem(S.key, JSON.stringify(S)); localStorage.setItem("tl_" + CONFIG.testId + "_last", S.key); } catch (e) { } }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function norm(s) { return String(s || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim(); }
function api(params) { return fetch(CONFIG.serverUrl + "?" + new URLSearchParams(params).toString()).then(function (r) { return r.json(); }); }
function apiPost(obj) { return fetch(CONFIG.serverUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(obj) }).then(function (r) { return r.json(); }); }
function today() { return new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); }

/* ===================== СТАРТОВЫЙ ЭКРАН ===================== */
function startScreen() {
  var last = null; try { last = JSON.parse(localStorage.getItem(localStorage.getItem("tl_" + CONFIG.testId + "_last")) || "null"); } catch (e) { }
  var pv = params.get("v"), pName = params.get("name") || "", pCls = params.get("cls") || params.get("class") || "", pCode = params.get("code") || "";
  var vSel = "";
  if (!pv && CONFIG.variantMode === "choose") {
    vSel = '<label>Номер варианта (назовёт учитель)</label><select id="sV"><option value="">— выберите —</option>';
    for (var i = 1; i <= CONFIG.variants; i++) vSel += '<option value="' + i + '">Вариант № ' + i + '</option>';
    vSel += "</select>";
  }
  var cls = '<option value="">— выберите —</option>' + CONFIG.classes.map(function (c) { return '<option' + (c === pCls ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
  var resume = (last && !last.submitted) ? '<div class="rules" style="background:#fff8e6;border-color:#f0d9a8;padding-left:16px">На этом компьютере есть незавершённая работа: <b>' + esc(last.name) + ", " + esc(last.cls) + ", вариант № " + last.v + '</b>. Чтобы продолжить её, введите те же данные.</div>' : "";
  $("paper").innerHTML =
    '<p class="h1">СУММАТИВНОЕ ОЦЕНИВАНИЕ · ГЕОГРАФИЯ · 11 КЛАСС</p><p class="h2">' + esc(CONFIG.title) + '</p>' +
    '<p class="h3">время выполнения — ' + CONFIG.minutes + ' минут · максимум — 50 баллов</p>' +
    '<div class="start" style="margin:26px auto 0">' + resume +
    '<label>Фамилия и имя</label><input id="sName" maxlength="60" value="' + esc(pName) + '" placeholder="Иванова Мария">' +
    '<label>Класс</label><select id="sCls">' + cls + '</select>' +
    '<label>Код ученика' + (CONFIG.requireCode ? "" : " (если выдан)") + '</label><input id="sCode" maxlength="30" value="' + esc(pCode) + '">' + vSel +
    '<ol class="rules"><li>На работу отводится <b>' + CONFIG.minutes + ' минут</b>. Таймер виден вверху страницы.</li>' +
    '<li>Можно пользоваться только <b>школьным атласом</b>.</li>' +
    '<li>Тест идёт в полноэкранном режиме. Выход из него или переход на другую вкладку <b>записывается как нарушение</b> и виден учителю.</li>' +
    '<li>Ответы сохраняются автоматически. Когда время закончится, работа сдастся сама.</li></ol>' +
    '<div style="text-align:center"><button class="btn" id="btnStart" style="font-size:16px;padding:12px 26px">Начать работу</button></div><div class="err" id="sErr" style="text-align:center"></div></div>';
  $("btnStart").onclick = function () {
    var name = $("sName").value.trim(), c = $("sCls").value, code = $("sCode").value.trim(), v = +pv || 0;
    if (!pv && CONFIG.variantMode === "choose") v = +$("sV").value;
    if (name.split(/\s+/).length < 2) return ($("sErr").textContent = "Введите фамилию и имя.");
    if (!c) return ($("sErr").textContent = "Выберите класс.");
    if (CONFIG.requireCode && !code) return ($("sErr").textContent = "Введите код ученика.");
    if (!pv && CONFIG.variantMode === "choose" && !v) return ($("sErr").textContent = "Выберите номер варианта.");
    var k = key(name, c, code), old = null;
    try { old = JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { }
    goFull();
    if (old && old.T) { S = old; A = S.answers || {}; openTest();
      if (!old.submitted && CONFIG.lockMode) lock("Работа была прервана: страница закрыта или перезагружена.", true);
      return; }
    if (!v) v = (hash(norm(name) + "|" + c + "|" + norm(code)) % CONFIG.variants) + 1;
    v = Math.min(CONFIG.variants, Math.max(1, v));
    $("btnStart").disabled = true; $("sErr").textContent = ""; $("btnStart").textContent = "Загружаю вариант…";
    api({ action: "variant", v: v }).then(function (r) {
      if (!r.ok) throw r.error;
      var now = Date.now();
      S = { key: k, v: v, name: name, cls: c, code: code, start: now, end: now + CONFIG.minutes * 60000, answers: {}, violations: [], submitted: false, locked: false, T: r.variant };
      A = S.answers; save(); openTest();
    }).catch(function () {
      $("btnStart").disabled = false; $("btnStart").textContent = "Начать работу";
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { }
      $("sErr").textContent = "Не удалось загрузить вариант. Проверьте интернет и нажмите ещё раз.";
    });
  };
}

/* ===================== ОТРИСОВКА ТЕСТА ===================== */
function L(id, max) { var s = '<div class="lbox" id="lb_' + id + '">L'; for (var i = 0; i <= max; i++) s += "<span>" + i + "</span>"; return s + "</div>"; }
function under(s) { return esc(s).replace(/\[\[(.+?)\]\]/g, "<u>$1</u>"); }
function selOpts(opts, ph) { return '<option value="">' + (ph || "—") + "</option>" + opts.map(function (o, i) { return '<option value="' + i + '">' + esc(o) + "</option>"; }).join(""); }
function selText(opts, ph) { return '<option value="">' + (ph || "—") + "</option>" + opts.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + "</option>"; }).join(""); }

var R = {
  tf: function (t) {
    return '<p class="q">Прочитайте утверждения. Если утверждение верное, отметьте <b>В</b>. Если неверное — отметьте <b>Н</b> и запишите вместо подчёркнутого слова (слов) такое, чтобы утверждение стало верным.</p>' +
      t.items.map(function (it, i) { var k = t.id + "_" + i;
        return '<div class="tf"><input class="inl" data-k="' + k + '_fix" placeholder="исправление" maxlength="60">' +
          '<div class="vn"><label><input type="radio" name="' + k + '" data-k="' + k + '" value="В"><span>В</span></label><label><input type="radio" name="' + k + '" data-k="' + k + '" value="Н"><span>Н</span></label></div>' +
          "<div>" + (i + 1) + ") " + under(it.s) + "</div></div>"; }).join("");
  },
  mc: function (t) {
    return '<p class="q">Выберите один правильный ответ.</p>' + t.items.map(function (it, i) { var k = t.id + "_" + i;
      return '<div class="mcq"><div>' + (i + 1) + ") " + esc(it.q) + "</div>" + it.opts.map(function (o, j) {
        return '<label class="opt"><input type="radio" name="' + k + '" data-k="' + k + '" value="' + j + '"><b>' + LET[j] + ")</b> " + esc(o) + "</label>"; }).join("") + "</div>"; }).join("");
  },
  match: function (t) {
    return '<p class="q">Соотнесите термины с их определениями. Одно определение лишнее.</p><div class="match"><div>' +
      t.terms.map(function (x, i) { return '<div class="mt"><span>' + (i + 1) + ". " + esc(x.term) + '</span><select class="sel" data-k="' + t.id + "_" + i + '"><option value=""></option>' +
        t.defs.map(function (_, j) { return '<option value="' + j + '">' + LET[j] + "</option>"; }).join("") + "</select></div>"; }).join("") +
      '</div><div class="defs">' + t.defs.map(function (d, j) { return "<div><b>" + LET[j] + ")</b>" + esc(d) + "</div>"; }).join("") + "</div></div>";
  },
  calc: function (t) {
    var h = '<p class="q">Используя данные таблицы, вычислите для каждой страны естественный прирост (‰), среднюю плотность населения (чел./км²) и уровень урбанизации (%). Ответы округлите до целого числа и впишите в таблицу.</p>' +
      '<table class="data"><tr><th>Страна</th><th>Население, млн чел.</th><th>Площадь, тыс. км²</th><th>Рождаемость, ‰</th><th>Смертность, ‰</th><th>Городское население, млн чел.</th><th>Естественный прирост, ‰</th><th>Плотность, чел./км²</th><th>Уровень урбанизации, %</th></tr>';
    t.rows.forEach(function (r, i) {
      h += '<tr><td class="l">' + r.name + "</td><td>" + r.P + "</td><td>" + r.S.toLocaleString("ru-RU") + "</td><td>" + r.N + "</td><td>" + r.M + "</td><td>" + String(r.U).replace(".", ",") + "</td>";
      for (var j = 0; j < 3; j++) h += '<td class="ans"><input class="inl" data-k="' + t.id + "_" + i + "_" + j + '" maxlength="8" inputmode="decimal"></td>';
      h += "</tr>";
    });
    return h + '</table><div class="small">Формулы: ест. прирост = рождаемость − смертность; D = Np / St; уровень урбанизации = городское население / всё население × 100.</div>';
  },
  gaps: function (t) {
    return '<p class="q">Прочитайте текст и заполните пропуски, выбрав подходящий вариант из списка.</p><div class="gaps">' +
      esc(t.text).replace(/§(\d+)§/g, function (_, i) { var b = t.blanks[+i]; return '<select class="sel" data-k="' + t.id + "_" + i + '">' + selOpts(b.opts, "— выберите —") + "</select>"; }) + "</div>";
  },
  atlas: function (t) {
    return '<p class="q">Используя карту плотности населения мира в атласе, впишите по две страны для каждой зоны средней плотности населения.</p>' +
      '<table class="data"><tr><th style="width:34%">Средняя плотность населения</th><th>Страна 1</th><th>Страна 2</th></tr>' +
      t.zones.map(function (z, i) { return '<tr><td class="l">' + esc(z.z) + '</td><td class="ans"><input class="inl" data-k="' + t.id + "_" + i + '_0" maxlength="40"></td><td class="ans"><input class="inl" data-k="' + t.id + "_" + i + '_1" maxlength="40"></td></tr>'; }).join("") + "</table>";
  },
  pyr: function (t) {
    return '<p class="q">Проанализируйте возрастно-половую пирамиду населения страны и выполните задания.</p><div class="pyr"><div>' + pyrSvg(t.shares) + '</div><div>' +
      '<div class="qrow">а) Тип пирамиды: <select class="sel" data-k="' + t.id + '_type">' + selText(t.tOpts, "— выберите —") + "</select></div>" +
      '<div class="qrow">б) Такая пирамида характерна для страны: <select class="sel" data-k="' + t.id + '_c">' + selOpts(t.cOpts, "— выберите —") + "</select></div>" +
      '<div class="qrow" style="margin-bottom:4px">в) Отметьте <b>два</b> верных утверждения об этом типе пирамиды:</div>' +
      t.st.map(function (x, i) { return '<label class="chk"><input type="checkbox" data-k="' + t.id + "_s" + i + '">' + esc(x.s) + "</label>"; }).join("") + "</div></div>";
  },
  order: function (t) {
    return '<p class="q">' + esc(t.q) + "</p><div class=\"order\">" + [0, 1, 2, 3].map(function (i) {
      return '<div class="row"><span class="n">' + (i + 1) + '</span><select class="sel" data-k="' + t.id + "_" + i + '">' + selText(t.items, "— выберите —") + "</select></div>"; }).join("") + "</div>";
  },
  chain: function (t) {
    var g = 0, h = '<p class="q">Восстановите причинно-следственную цепочку: выберите недостающие звенья. Затем ответьте на вопрос.</p><div class="chain-title">' + esc(t.title) + '</div><div class="chain">';
    t.links.forEach(function (l, i) {
      if (i) h += '<span class="arr">→</span>';
      h += l === null ? '<select class="sel" data-k="' + t.id + "_" + i + '">' + selText(t.opts, "— звено " + (i + 1) + " —") + "</select>" : '<div class="lk">' + esc(l) + "</div>";
    });
    return h + "</div><div>" + esc(t.open) + '</div><textarea class="ta" data-k="' + t.id + '_open" maxlength="1500"></textarea><div id="ai_' + t.id + '"></div>';
  },
  sit: function (t) {
    return '<p class="q">Проанализируйте ситуацию и дайте развёрнутый ответ.</p><div class="case">' + esc(t.t) + "</div><div style=\"margin-bottom:8px\">" + esc(t.q) +
      '</div><textarea class="ta" data-k="' + t.id + '" maxlength="3000" style="min-height:170px"></textarea><div id="ai_' + t.id + '"></div>';
  },
  essay: function (t) {
    var tb = "";
    if (t.table) tb = '<table class="data" style="width:auto;min-width:60%;margin-bottom:10px">' + t.table.map(function (r, i) {
      return "<tr>" + r.map(function (c, j) { return i ? (j ? "<td>" : '<td class="l">') + esc(c) + "</td>" : "<th>" + esc(c) + "</th>"; }).join("") + "</tr>"; }).join("") + "</table>";
    return '<p class="q">' + esc(t.q) + "</p>" + tb + '<textarea class="ta" data-k="' + t.id + '" maxlength="3000" style="min-height:170px"></textarea><div id="ai_' + t.id + '"></div>';
  }
};

function pyrSvg(sh) {
  var ages = ["0–9", "10–19", "20–29", "30–39", "40–49", "50–59", "60+"], W = 330, H = 250, cx = 165, rowH = 28, top = 14, sc = 7.2;
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="http://www.w3.org/2000/svg" font-family="PT Sans,Arial" font-size="11">';
  for (var i = 0; i < 7; i++) {
    var y = top + (6 - i) * rowH, m = sh[i] * (i >= 5 ? 0.92 : 1.02), f = sh[i] * (i >= 5 ? 1.08 : 0.98);
    s += '<rect x="' + (cx - 20 - m * sc) + '" y="' + y + '" width="' + (m * sc) + '" height="' + (rowH - 5) + '" fill="#6f98c8"/>';
    s += '<rect x="' + (cx + 20) + '" y="' + y + '" width="' + (f * sc) + '" height="' + (rowH - 5) + '" fill="#d99aa8"/>';
    s += '<text x="' + cx + '" y="' + (y + 16) + '" text-anchor="middle" fill="#444">' + ages[i] + "</text>";
  }
  var yb = top + 7 * rowH + 4;
  s += '<line x1="10" y1="' + yb + '" x2="' + (W - 10) + '" y2="' + yb + '" stroke="#b9c3cf"/>';
  s += '<text x="' + (cx - 20) + '" y="' + (yb + 16) + '" text-anchor="end" fill="#3f6a9c">Мужчины, %</text><text x="' + (cx + 20) + '" y="' + (yb + 16) + '" fill="#a35466">Женщины, %</text>';
  [5, 10, 15].forEach(function (v) { s += '<text x="' + (cx - 20 - v * sc) + '" y="' + (yb + 30) + '" text-anchor="middle" fill="#888">' + v + '</text><text x="' + (cx + 20 + v * sc) + '" y="' + (yb + 30) + '" text-anchor="middle" fill="#888">' + v + "</text>"; });
  return s.replace('viewBox="0 0 330 250"', 'viewBox="0 0 330 ' + (yb + 36) + '"') + "</svg>";
}

function openTest() {
  T = S.T;
  $("bar").classList.remove("hidden");
  $("barV").textContent = "Вариант № " + S.v;
  $("barWho").textContent = S.name + ", " + S.cls;
  var h = '<p class="h1">СУММАТИВНОЕ ОЦЕНИВАНИЕ · ГЕОГРАФИЯ · 11 КЛАСС</p><p class="h2">' + esc(CONFIG.title) + '</p>' +
    '<p class="h3">время выполнения — ' + CONFIG.minutes + ' минут · максимум — 50 баллов · разрешено: школьный атлас</p>' +
    '<div class="fields"><div class="f">Ф.И. ученика: <span class="v">' + esc(S.name) + '</span></div><div class="f">Всего баллов: <span class="v" style="min-width:90px">50</span></div>' +
    '<div class="f">Класс: <span class="v">' + esc(S.cls) + '</span></div><div class="f">Набрано баллов: <span class="v" id="fScore" style="min-width:90px">&nbsp;</span></div>' +
    '<div class="f">Дата: <span class="v">' + today() + '</span></div><div class="f">Отметка: <span class="v" id="fMark" style="min-width:90px">&nbsp;</span></div></div>' +
    '<div class="variant">Вариант № ' + S.v + '</div><div id="resBox"></div>' +
    '<table class="main"><thead><tr><th>№</th><th>ЗАДАНИЯ</th><th>БАЛЛЫ</th></tr></thead><tbody>';
  var sec = 0;
  T.tasks.forEach(function (t, n) {
    if (t.sec !== sec) { sec = t.sec; h += '<tr class="sec"><td colspan="3">' + SEC[sec] + "</td></tr>"; }
    h += '<tr><td class="no">' + (n + 1) + '.</td><td id="cell_' + t.id + '">' + R[t.type](t) + '</td><td class="pts"><b>' + t.pts + "</b> б." + L(t.id, t.pts) + '<div class="ptsnote" id="pn_' + t.id + '"></div></td></tr>';
  });
  h += "</tbody></table>";
  $("paper").innerHTML = h;
  restore();
  $("paper").addEventListener("input", onAns);
  $("paper").addEventListener("change", onAns);
  if (S.submitted) { showResult(); if (!S.result || !S.result.done) sendLoop(); return; }
  startTimer();
  progress();
}

function restore() {
  document.querySelectorAll("[data-k]").forEach(function (el) {
    var v = A[el.dataset.k]; if (v === undefined) return;
    if (el.type === "radio") el.checked = el.value === String(v);
    else if (el.type === "checkbox") el.checked = !!v;
    else el.value = v;
  });
  syncUi();
}
function onAns(e) {
  var el = e.target; if (!el.dataset || !el.dataset.k || S.submitted) return;
  if (el.type === "radio") { if (el.checked) A[el.dataset.k] = el.value; }
  else if (el.type === "checkbox") A[el.dataset.k] = el.checked;
  else A[el.dataset.k] = el.value;
  syncUi(); save(); progress();
}
function syncUi() {
  document.querySelectorAll(".opt").forEach(function (o) { o.classList.toggle("sel", o.querySelector("input").checked); });
  T.tasks.forEach(function (t) { if (t.type === "tf") t.items.forEach(function (_, i) {
    var f = document.querySelector('[data-k="' + t.id + "_" + i + '_fix"]'); if (f) f.disabled = A[t.id + "_" + i] === "В"; }); });
}
function answered(t) {
  var id = t.id, has = function (k) { return A[k] !== undefined && A[k] !== "" && A[k] !== false; };
  if (t.type === "sit" || t.type === "essay") return has(id);
  return Object.keys(A).some(function (k) { return k.indexOf(id + "_") === 0 && has(k); });
}
function progress() { var n = T.tasks.filter(answered).length; $("prog").textContent = "Заданий начато: " + n + " из " + T.tasks.length; }

/* ===================== ТАЙМЕР ===================== */
function startTimer() {
  clearInterval(tick);
  var f = function () {
    var left = Math.max(0, S.end - Date.now()), m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    $("timer").textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    $("timer").classList.toggle("warn", left < 5 * 60000);
    if (left <= 0) { clearInterval(tick); submit(true); }
  };
  f(); tick = setInterval(f, 500);
}

/* ===================== ЗАЩИТНЫЙ РЕЖИМ ===================== */
function goFull() { var d = document.documentElement; try { (d.requestFullscreen || d.webkitRequestFullscreen || function () { }).call(d); } catch (e) { } }
function running() { return S && !S.submitted && !submitting && $("bar") && !$("bar").classList.contains("hidden"); }
function lock(reason, force) {
  if (!CONFIG.lockMode || !S || S.submitted || submitting) return;
  if (!force && !running()) return;
  if (!$("ovLock").classList.contains("hidden")) return;
  S.locked = true; S.violations.push({ t: new Date().toISOString(), r: reason }); save();
  $("lockReason").textContent = reason;
  $("ovLock").classList.remove("hidden");
}
$("btnUnlock").onclick = function () {
  S.locked = false; save(); $("ovLock").classList.add("hidden"); goFull();
};
document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement) setTimeout(function () { lock("Вы вышли из полноэкранного режима."); }, 150); });
document.addEventListener("visibilitychange", function () { if (document.hidden) lock("Вы переключились на другую вкладку или окно."); });
window.addEventListener("blur", function () { setTimeout(function () { if (!document.hasFocus()) lock("Вы переключились на другое окно."); }, 400); });
["copy", "cut", "paste", "contextmenu", "dragstart", "drop"].forEach(function (ev) { document.addEventListener(ev, function (e) { if (running()) e.preventDefault(); }); });
document.addEventListener("keydown", function (e) {
  if (!running()) return;
  var k = e.key.toLowerCase();
  if (e.key === "F12" || (e.ctrlKey && ["u", "s", "p", "c", "v", "x"].indexOf(k) >= 0) || (e.ctrlKey && e.shiftKey && ["i", "j", "c"].indexOf(k) >= 0)) e.preventDefault();
});
window.addEventListener("beforeunload", function (e) { if (running()) { save(); e.preventDefault(); e.returnValue = ""; } });

/* ===================== СДАЧА ===================== */
$("btnSubmit").onclick = function () {
  var empty = T.tasks.filter(function (t) { return !answered(t); }).map(function (t, i) { return T.tasks.indexOf(t) + 1; });
  $("submitInfo").innerHTML = empty.length ? "Не начаты задания: <b>" + empty.join(", ") + "</b>. После сдачи изменить ответы будет нельзя." : "Все задания начаты. После сдачи изменить ответы будет нельзя.";
  $("ovSubmit").classList.remove("hidden");
};
$("btnCancel").onclick = function () { $("ovSubmit").classList.add("hidden"); };
$("btnConfirm").onclick = function () { $("ovSubmit").classList.add("hidden"); submit(false); };

function submit(auto) {
  if (submitting || S.submitted) return;
  submitting = true; clearInterval(tick);
  $("ovLock").classList.add("hidden");
  S.submitted = true; S.submittedAt = Date.now(); S.autoSubmitted = !!auto; S.result = null; save();
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { }
  showResult();
  sendLoop();
}

/* отправка на сервер с повтором при обрыве связи, затем ожидание ИИ-проверки */
var loopTimer = null;
function sendLoop() {
  clearTimeout(loopTimer);
  var st = S;
  var req = (st.sentOk ? api({ action: "status", id: st.key + "_" + st.start }) :
    apiPost({ action: "submit", clientId: st.key + "_" + st.start, variant: st.v, name: st.name, cls: st.cls, code: st.code,
      answers: st.answers, violations: st.violations, autoSubmitted: st.autoSubmitted }));
  req.then(function (r) {
    if (!r.ok) throw r.error;
    st.sentOk = true; st.result = r; store(st);
    if (st === S) showResult();
    if (!r.done) loopTimer = setTimeout(sendLoop, 15000);
  }).catch(function () {
    if (st === S) showResult(true);
    loopTimer = setTimeout(sendLoop, 15000);
  });
}

function showResult(offline) {
  var r = S.result; $("paper").classList.add("done");
  document.querySelectorAll("[data-k]").forEach(function (el) { el.disabled = true; });
  $("btnSubmit").classList.add("hidden"); $("prog").textContent = "Работа сдана"; clearInterval(tick);
  $("timer").textContent = "Сдано"; $("timer").classList.remove("warn");
  var box = $("resBox");
  if (!r) {
    box.innerHTML = '<div class="result"><div class="big">Работа сдана' + (S.autoSubmitted ? " (время вышло)" : "") + "</div>" +
      (offline ? "Нет связи с сервером. Ответы сохранены на этом компьютере, отправка повторяется автоматически. Не закрывайте страницу." : "Отправляю ответы на проверку…") + "</div>";
    return;
  }
  var waiting = !r.done;
  if (!CONFIG.showResultToStudent) { box.innerHTML = '<div class="result"><div class="big">Работа отправлена учителю</div>Результат вам сообщит учитель.</div>'; return; }
  $("fScore").textContent = waiting ? "проверяется" : r.total;
  $("fMark").textContent = waiting ? "проверяется" : r.mark;
  box.innerHTML = waiting
    ? '<div class="result"><div class="big">Работа принята. Задания 1–8 проверены</div>Нейросети проверяют развёрнутые ответы (задания 9–11). Обычно это занимает 1–3 минуты, страница обновится сама.</div>'
    : '<div class="result"><div class="big">Набрано ' + r.total + " из 50 баллов · отметка " + r.mark + "</div>" +
      (/вручную/.test(r.status) ? "Развёрнутые ответы проверит учитель." : "Развёрнутые ответы проверены нейросетями. Учитель может уточнить баллы.") +
      (S.violations.length ? "<br>Выходов из теста: " + S.violations.length + "." : "") +
      (r.comments && r.comments.spelling ? '<br><span style="color:#6d4300">Ошибки в письменной речи: ' + esc(r.comments.spelling) + "</span>" : "") + "</div>";
  T.tasks.forEach(function (t) {
    var lb = $("lb_" + t.id), open = t.type === "sit" || t.type === "essay" || t.type === "chain";
    var sc = r.scores ? r.scores[t.id] : null;
    lb.querySelectorAll("span").forEach(function (s, i) { s.classList.toggle("on", !(waiting && (t.type === "sit" || t.type === "essay")) && i === sc); });
    lb.classList.toggle("pending", waiting && open);
    $("pn_" + t.id).className = "ptsnote ai";
    $("pn_" + t.id).textContent = waiting && open ? "проверяется…" : "";
    var c = r.comments && r.comments[t.id];
    if ($("ai_" + t.id)) $("ai_" + t.id).innerHTML = (!waiting && c) ? '<div class="ai-c ok"><b>Комментарий:</b> ' + esc(c) + "</div>" : "";
  });
}

function retryPending() {
  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i);
    if (k.indexOf("tl_" + CONFIG.testId + "_") === 0 && k.slice(-5) !== "_last") {
      try { var o = JSON.parse(localStorage.getItem(k)); if (o && o.submitted && !o.sentOk) bgSend(o); } catch (e) { } } }
}
function bgSend(o) {
  apiPost({ action: "submit", clientId: o.key + "_" + o.start, variant: o.v, name: o.name, cls: o.cls, code: o.code, answers: o.answers, violations: o.violations, autoSubmitted: o.autoSubmitted })
    .then(function (r) { if (r.ok) { o.sentOk = true; o.result = r; store(o); } }).catch(function () { });
}

/* ===================== ЗАПУСК ===================== */
retryPending();
startScreen();

</script>
</body>
</html>
